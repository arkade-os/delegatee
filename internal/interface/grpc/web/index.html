<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delegateed operator</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f4f5f7; --surface: #ffffff; --ink: #16181d; --muted: #5f636d; --faint: #989ba4; --line: #e3e5e9; --hover: #f5f6f8; --current: #eeecfd;
  --ok: #18794e; --ok-soft: #e3f4ea; --window: #a35f00; --window-a: #fbefd6; --window-b: #f2d9a0; --bad: #c4321f; --bad-soft: #fcebe8;
  --track: #eceef1; --elapsed: rgba(22, 24, 29, .2); --accent: #5b4bdb; --accent-soft: #e9e6fc; --accent-ink: #ffffff; --shadow: 0 12px 32px rgba(22, 24, 29, .16);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px; --panel: 12px; --head: 3.25rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0d0e11; --surface: #15161a; --ink: #ececf0; --muted: #9a9ca6; --faint: #686a73; --line: #26272d; --hover: #1c1d22; --current: #221f38;
    --ok: #4cc38a; --ok-soft: #12291d; --window: #e9a83b; --window-a: #33270f; --window-b: #4d3b14; --bad: #f2735f; --bad-soft: #36160f;
    --track: #23242a; --elapsed: rgba(236, 236, 240, .22); --accent: #a99bff; --accent-soft: #29254a; --accent-ink: #0d0e11; --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hash { font-family: var(--mono); font-size: .86em; word-break: break-all; }
.n { font-variant-numeric: tabular-nums; }
kbd { font: .8em var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3rem; background: var(--surface); }
[hidden] { display: none !important; }

/* buttons */
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 0 .8rem; min-height: 2rem; font-weight: 500; font-size: .86rem; transition: background .12s, border-color .12s, color .12s; }
button:hover { background: var(--hover); border-color: var(--faint); }
button:active { background: var(--current); }
button:disabled { cursor: default; opacity: .5; }
button:disabled:hover { background: var(--surface); border-color: var(--line); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.danger { color: var(--bad); }
button.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
button.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
button.danger.solid:hover { filter: brightness(1.08); background: var(--bad); }
button.link { border: 0; background: none; padding: 0; min-height: 0; font-weight: inherit; font-size: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: .15em; border-radius: 2px; }
button.link:hover { background: none; color: var(--ink); }
/* hashes read as data: ink, underlined on hover only */
button.link.hash, .horizon button, a.hash { color: var(--ink); text-decoration: none; }
button.link.hash:hover, .horizon button:hover, a.hash:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .2em; }
button.mini { min-height: 0; padding: 0 .45rem; margin-left: .5rem; font: 500 .74rem/1.6 var(--sans); color: var(--muted); border-radius: 4px; vertical-align: .1em; }
button.mini:hover { color: var(--ink); }
button[aria-busy=true] { pointer-events: none; opacity: .7; }
button[aria-busy=true]::after { content: "…"; }

/* tooltips */
#tooltip { position: fixed; z-index: 50; max-width: 19rem; padding: .4rem .6rem; border-radius: var(--r); background: var(--ink); color: var(--paper); font: 400 .76rem/1.45 var(--sans); pointer-events: none; box-shadow: var(--shadow); }
.tip { display: inline-grid; place-items: center; width: 1rem; height: 1rem; min-height: 0; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--faint); font: 600 .64rem/1 var(--sans); vertical-align: .08em; cursor: help; }
.tip:hover { color: var(--ink); background: none; }

/* header */
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1.75rem; height: var(--head); padding: 0 clamp(1rem, 3vw, 2rem); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 650; font-size: .98rem; letter-spacing: -.015em; color: var(--ink); text-decoration: none; flex: none; }
.brand::before { content: ""; width: .8rem; height: .8rem; border-radius: 3px; background: var(--accent); box-shadow: .3rem .3rem 0 -.1rem color-mix(in srgb, var(--accent) 40%, transparent); }
nav { display: flex; align-self: stretch; gap: .25rem; }
nav a { display: flex; align-items: center; gap: .4rem; padding: 0 .7rem; color: var(--muted); text-decoration: none; font-weight: 500; font-size: .88rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav a:hover { color: var(--ink); }
nav a[aria-current=page] { color: var(--ink); border-bottom-color: var(--accent); }
nav .count { min-width: 1.15rem; padding: 0 .35rem; border-radius: 99px; background: var(--bad); color: #fff; font-size: .7rem; font-weight: 600; text-align: center; line-height: 1.15rem; }
.headright { margin-left: auto; display: flex; align-items: center; gap: 1.25rem; min-width: 0; }
#pulse { display: inline-block; min-height: 1.85rem; padding: 0 .75rem; border-radius: 99px; background: var(--paper); border-color: var(--line); color: var(--muted); font-size: .8rem; font-weight: 500; white-space: nowrap; }
#pulse b { color: var(--ink); font-weight: 600; }
#pulse.busy, #pulse.busy b { color: var(--window); }
#pulse.warn, #pulse.warn b { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
#meta { display: flex; align-items: center; gap: .9rem; color: var(--muted); font-size: .8rem; white-space: nowrap; }
#meta .net { padding: .05rem .5rem; border-radius: 99px; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
#meta button { all: unset; cursor: pointer; color: var(--ink); font: .78rem var(--mono); text-decoration: underline dotted; text-underline-offset: .2em; border-radius: 2px; }
#meta button:hover { color: var(--accent); }
#health { width: .6rem; height: .6rem; border-radius: 50%; background: var(--faint); flex: none; }
#health.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
#health.down { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.pulse { display: inline-block; width: .5rem; height: .5rem; margin-right: .45rem; border-radius: 50%; background: var(--window); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* split pages: a list on the left, what it selects on the right */
.split { display: grid; grid-template-columns: minmax(20rem, 26rem) minmax(0, 1fr); min-height: calc(100vh - var(--head)); }
.list { border-right: 1px solid var(--line); background: var(--surface); min-width: 0; }
.list .pane { display: flex; flex-direction: column; height: calc(100vh - var(--head)); position: sticky; top: var(--head); }
.list .pane > :not(.rows) { flex-shrink: 0; }
.filters { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.filters button { flex: 1; border: 0; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: .65rem .5rem; min-height: 0; color: var(--muted); font-size: .86rem; font-weight: 500; background: none; white-space: nowrap; }
.filters button:hover { background: var(--hover); color: var(--ink); }
.filters button[aria-pressed=true] { color: var(--ink); border-bottom-color: var(--accent); }
.filters .n { color: var(--faint); margin-left: .15rem; }
.filters .alert .n { color: var(--bad); font-weight: 600; }
.filters button[aria-pressed=true] .n { color: var(--muted); }
.search { display: block; width: calc(100% - 1.5rem); margin: .65rem .75rem .55rem; padding: .45rem .7rem; min-height: 2.15rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.search:focus, .register textarea:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.listbar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 0 .75rem .6rem; }
.kinds { display: flex; gap: .35rem; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.kinds::-webkit-scrollbar { display: none; }
.kinds.more { mask-image: linear-gradient(to right, #000 82%, transparent); }
.kinds button { flex: none; min-height: 0; padding: .15rem .6rem; border: 1px solid var(--line); border-radius: 99px; background: none; color: var(--muted); font-size: .76rem; font-weight: 500; }
.kinds button[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--current); }
.kinds .n { color: var(--faint); margin-left: .25rem; }
.sort { position: relative; flex: none; color: var(--muted); }
.sort:hover { color: var(--ink); }
.sort select { appearance: none; -webkit-appearance: none; border: 0; background: none; color: inherit; font: 500 .76rem var(--sans); padding: .25rem 1.15rem .25rem .4rem; border-radius: var(--r); cursor: pointer; }
.sort select:hover { background: var(--hover); }
.sort::after { content: ""; position: absolute; right: .45rem; top: 50%; width: .32rem; height: .32rem; margin-top: -.24rem; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.rows { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.rows li > button { display: grid; grid-template-columns: .6rem minmax(0, 1fr) auto; gap: .15rem .7rem; align-items: baseline; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: .7rem 1rem; min-height: 0; font-weight: 400; background: none; box-shadow: inset 3px 0 0 transparent; }
.rows li > button:hover { background: var(--hover); }
.rows li > button[aria-current=true] { background: var(--current); box-shadow: inset 3px 0 0 var(--accent); }
.rows li > button:focus-visible { outline-offset: -2px; }
.rows .amt { font-variant-numeric: tabular-nums; font-size: .86rem; font-weight: 600; white-space: nowrap; text-align: right; }
.rows .count { color: var(--faint); font-size: .76rem; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.rows .kind { color: var(--faint); }
.rows .sub { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .sub.bad, .rows .sub.late { color: var(--bad); } .rows .sub.renewing { color: var(--window); }
.dot { width: .5rem; height: .5rem; border-radius: 50%; align-self: center; background: var(--line); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad, .dot.late { background: var(--bad); } .dot.renewing { background: var(--window); } .dot.off { background: none; border: 1px solid var(--faint); }
.tag { display: inline-block; margin-right: .35rem; padding: 0 .4rem; border-radius: 4px; background: var(--track); color: var(--muted); font-size: .7rem; font-weight: 500; line-height: 1.5; vertical-align: .05em; }
.tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.ok { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 1.25rem 1rem; color: var(--muted); max-width: 36rem; line-height: 1.55; }
.hint { display: flex; justify-content: space-between; gap: .5rem; padding: .45rem .9rem; border-top: 1px solid var(--line); color: var(--faint); font-size: .76rem; }

/* skeletons */
.sk { display: block; height: .8em; border-radius: 3px; background: var(--track); animation: sk 1.2s ease-in-out infinite; }
@keyframes sk { 50% { opacity: .45; } }
.rows li.sk-row { display: grid; grid-template-columns: .6rem 1fr auto; gap: .35rem .6rem; align-items: center; padding: .8rem .75rem .8rem .9rem; border-bottom: 1px solid var(--line); }
.rows li.sk-row .sk:first-child { width: .55rem; height: .55rem; border-radius: 50%; }
.rows li.sk-row .sk:last-child { width: 4rem; }
.rows li.sk-row .sk:nth-child(4) { grid-column: 2 / 4; width: 60%; }
.sk-detail .sk { margin: .6rem 0; }
@media (prefers-reduced-motion: reduce) { .pulse, .sk { animation: none; } button { transition: none; } }

/* detail */
.detail { padding: 2rem clamp(1rem, 3.5vw, 3rem) 5rem; min-width: 0; max-width: 76rem; }
.detail[aria-busy=true] { opacity: .85; }
.detail h2 { font-size: 1.4rem; letter-spacing: -.025em; display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; }
.detail h3 { display: flex; align-items: center; gap: .45rem; font-size: .96rem; margin: 2rem 0 .9rem; padding-top: 1.5rem; border-top: 1px solid var(--line); letter-spacing: -.01em; }
.detail h3 .aside { margin-left: auto; color: var(--muted); font-size: .8rem; font-weight: 400; }
.detail h4 { font-size: .88rem; margin: 1.25rem 0 .4rem; display: flex; align-items: center; gap: .5rem; }
.detail .empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 1.1rem 1.25rem; }
.blank { display: grid; place-content: center; min-height: 60vh; text-align: center; color: var(--muted); gap: .6rem; }
.blank b { color: var(--ink); font-size: 1rem; }
.title { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: flex-start; justify-content: space-between; }
.title .hash { margin-top: .35rem; font-size: .86rem; max-width: 46rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, max-content)); gap: .75rem 3rem; margin: 1.5rem 0 0; padding: 1rem 0 0; border-top: 1px solid var(--line); }
.facts div { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.facts dt { color: var(--muted); font-size: .76rem; display: flex; align-items: center; gap: .35rem; }
.facts dd { margin: 0; font-weight: 600; font-size: .96rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .45rem; }
.facts dd .mini { margin-left: 0; flex: none; }
.facts dd .hash { word-break: normal; }
.badge { display: inline-flex; align-items: center; gap: .4rem; border-radius: 99px; padding: .1rem .65rem .1rem .5rem; font-size: .76rem; font-weight: 500; letter-spacing: 0; border: 1px solid var(--line); color: var(--muted); }
.badge::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--faint); }
.badge.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; } .badge.ok::before { background: var(--ok); }
.badge.bad, .badge.late { color: var(--bad); background: var(--bad-soft); border-color: transparent; } .badge.bad::before, .badge.late::before { background: var(--bad); }
.badge.renewing { color: var(--window); background: var(--window-a); border-color: transparent; } .badge.renewing::before { background: var(--window); }
.badge.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; } .badge.accent::before { background: var(--accent); }
.note { border-left: 3px solid var(--bad); padding: .55rem .9rem; margin: 1rem 0 0; background: var(--bad-soft); border-radius: 0 var(--r) var(--r) 0; max-width: 46rem; font-size: .88rem; }
.paths { list-style: none; margin: 0; padding: 0; max-width: 46rem; }
.paths li { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--line); } .paths li:last-child { border-bottom: 0; }
.paths .words { font-family: var(--mono); font-size: .86em; }
.refs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.refs button { font: .8rem var(--mono); min-height: 1.75rem; }
.refs .tag { font: .78rem var(--mono); padding: .15rem .5rem; }

/* lifetime bar: birth to expiry, renewal window hatched */
.vtxo { padding: .9rem 0; } .vtxo + .vtxo { border-top: 1px solid var(--line); }
.vtxo .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .25rem 1rem; }
.vtxo .amount { font-weight: 600; }
.life { position: relative; height: .55rem; margin: .65rem 0 .45rem; background: var(--track); border-radius: 99px; }
.life .elapsed { position: absolute; inset: 0 auto 0 0; background: var(--elapsed); z-index: 1; border-radius: 4px 0 0 4px; }
.life .window { position: absolute; inset: 0 0 0 auto; background: repeating-linear-gradient(135deg, var(--window-a) 0 5px, var(--window-b) 5px 10px); border-left: 2px solid var(--window); border-radius: 0 4px 4px 0; }
.life .now { position: absolute; z-index: 2; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.life .reserve, .horizon .lane .reserve, .legend i.r { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 4px, var(--track) 4px 8px); border-left: 2px solid var(--bad); }
.life .reserve { position: absolute; inset: 0 0 0 auto; z-index: 1; border-radius: 0 4px 4px 0; }
.life .batch, .horizon .lane .batch, .legend i.b { position: absolute; z-index: 3; top: 50%; width: .7rem; height: .7rem; margin: -.35rem 0 0 -.35rem; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-sizing: border-box; }
.legend i.b { position: static; display: inline-block; margin: 0 .35rem 0 .2rem; vertical-align: middle; }
.state { font-size: .82rem; color: var(--muted); }
.state.in, .state.renewing { color: var(--window); font-weight: 600; } .state.late { color: var(--bad); font-weight: 600; }

/* every address on one time axis */
.horizon { display: grid; grid-template-columns: minmax(7rem, 10rem) minmax(0, 1fr) minmax(0, 22rem); gap: .55rem 1.25rem; align-items: center; font-size: .84rem; }
.horizon button { all: unset; font: .86em var(--mono); cursor: pointer; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 2px; }
.horizon button:focus-visible { outline: 2px solid var(--accent); }
.horizon .lane { position: relative; display: flex; height: .55rem; background: var(--track); border-radius: 99px; }
.horizon .lane .left, .horizon .lane .window, .horizon .lane .reserve { height: 100%; }
.horizon .lane .left { border-radius: 99px 0 0 99px; background: var(--elapsed); } .horizon .lane .reserve { border-radius: 0 99px 99px 0; }
.horizon .lane .window { background: repeating-linear-gradient(135deg, var(--window-a) 0 5px, var(--window-b) 5px 10px); border-left: 2px solid var(--window); }
.horizon .lane.late { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.horizon .lane .window, .life .window, .horizon .lane .reserve, .life .reserve { min-width: 3px; }
.horizon .t { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.horizon .t.in, .horizon .t.renewing { color: var(--window); font-weight: 600; } .horizon .t.late { color: var(--bad); font-weight: 600; }
.axis { position: relative; height: 1.4rem; border-top: 1px solid var(--line); font-size: .72rem; color: var(--faint); }
.axis i { position: absolute; top: 0; padding: .25rem 0 0 .3rem; border-left: 1px solid var(--line); font-style: normal; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.25rem; margin: 1rem 0 0; color: var(--muted); font-size: .78rem; }
.legend i { display: inline-block; width: 1.1rem; height: .55rem; border-radius: 2px; vertical-align: middle; margin-right: .35rem; background: var(--elapsed); }
.legend i.w { background: repeating-linear-gradient(135deg, var(--window-a) 0 5px, var(--window-b) 5px 10px); border-left: 2px solid var(--window); }

/* overview */
.overview { max-width: 84rem; margin: 0 auto; padding: 1.75rem clamp(1rem, 3vw, 2rem) 4rem; }
.ov-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.5rem; margin-bottom: 1.1rem; }
.ov-head h2 { font-size: 1.35rem; letter-spacing: -.025em; }
.ov-head p { color: var(--muted); font-size: .84rem; }
.ov-head .warn { color: var(--bad); font-weight: 500; }
.overview > .note { margin: 0 0 1.1rem; max-width: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); margin: 0 0 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--panel); overflow: hidden; }
.stat { display: flex; flex-direction: column; gap: .3rem; min-width: 0; padding: 1rem 1.25rem 1.1rem; margin: 0 0 0 -1px; border: 0; border-left: 1px solid var(--line); border-radius: 0; background: none; text-align: left; font-weight: 400; color: var(--ink); }
button.stat:hover { background: var(--hover); border-color: var(--line); }
.stat .label { color: var(--muted); font-size: .8rem; font-weight: 500; }
.stat .fig { font-size: clamp(1.3rem, 2.4vw, 1.6rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .fig small { margin-left: .3rem; font-size: .78rem; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.stat .sub { color: var(--muted); font-size: .78rem; }
.stat.alert .fig { color: var(--bad); }
.stat.good .fig { color: var(--ok); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--panel); padding: 1.15rem 1.35rem 1.35rem; margin-bottom: 1.25rem; min-width: 0; }

.hero { display: grid; grid-template-columns: minmax(12rem, 16rem) minmax(0, 1fr); gap: 1.5rem 2.5rem; align-items: center; padding-bottom: 1.35rem; }

.tl { position: relative; height: 5.5rem; margin: 0 .75rem; }

.tl .m { position: absolute; top: 2.9rem; z-index: 2; width: var(--s); height: var(--s); margin: calc(var(--s) / -2 + 1px) 0 0 calc(var(--s) / -2); padding: 0; min-height: 0; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--accent) 78%, var(--surface)); box-shadow: 0 0 0 2px var(--surface); }
.tl .m:hover, .tl .m:focus-visible { background: var(--accent); }
.tl .m.first { background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); }

/* documents */

.doc .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .35rem .5rem .35rem .75rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
.doc pre { margin: 0; padding: .75rem; overflow: auto; max-height: 36rem; font: .8rem/1.55 var(--mono); tab-size: 2; }
.j-k { color: var(--accent); } .j-s { color: var(--ok); } .j-n { color: var(--window); } .j-b { color: var(--bad); } .j-p { color: var(--faint); }

.register[aria-busy=true] { opacity: .7; pointer-events: none; }

dialog { border: 1px solid var(--line); border-radius: var(--panel); padding: 1.25rem 1.5rem 1.5rem; width: min(30rem, calc(100vw - 2rem)); color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }

<body>

      </div>
      <ul class="rows" id="rows"><li class="sk-row"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></li><li class="sk-row"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></li><li class="sk-row"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></li></ul>
      <div class="hint"><span id="shown"></span><span><kbd>↑</kbd> <kbd>↓</kbd> move, <kbd>/</kbd> find</span></div>

</main>
<dialog id="confirm" aria-labelledby="confirm-title">

  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<div id="tooltip" aria-hidden="true" hidden></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = (s, n = 10) => (s.length > 2 * n + 1 ? s.slice(0, n) + "…" + s.slice(-n) : s);
const num = (v) => Number(v || 0); // the gateway encodes int64 as strings
const sats = (v) => num(v).toLocaleString() + " sats";
const plural = (n, word, many = word + "s") => `${num(n).toLocaleString()} ${num(n) === 1 ? word : many}`;
const nowSecs = () => Date.now() / 1000;
const charges = (program) => Boolean(program) && Number(program) !== 0; // "0.0" is a fee program too
const skeleton = (n) => `<div class="sk-detail" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="sk" style="width:${[55, 90, 40, 70, 30][i % 5]}%"></i>`).join("")}</div>`;
const tip = (text) => `<button type="button" class="tip" data-tip="${esc(text)}" aria-label="${esc(text)}">?</button>`;
const dateOf = (ts) => new Date(num(ts) * 1000).toLocaleString();

const EXPLORERS = { bitcoin: "https://arkade.space", mutinynet: "https://explorer.mutinynet.arkade.sh" };
const explorer = () => EXPLORERS[info?.network];
// explore links a txid, an outpoint or an Ark address to the network's explorer, else shows it as is
function explore(value, label = value) {
  if (!explorer() || !value) return esc(label);
  const path = /^t?ark1/.test(value) ? "address/" + value : "tx/" + value.split(":")[0];
  return `<a class="hash" href="${esc(explorer() + "/" + path)}" target="_blank" rel="noopener" title="Open in the explorer">${esc(label)}</a>`;
}
let delegations = [], status = null, filter = null, detail = null, allVtxos = false, allBatches = false, info = null;
let templates = [], artifacts = [], usedBy = {};
let loadLimit = 5000, moreRows = false; // newest first, a page of 1000 at a time
// page is overview, delegations or catalog; selected is "id/N" or an address, csel a template or artifact id
let page = "overview", selected = "", ctab = "templates", csel = "";

const OPS = { 0x75: "DROP", 0x87: "EQUAL", 0x88: "EQUALVERIFY", 0xa8: "SHA256", 0xa9: "HASH160", 0xac: "CHECKSIG", 0xad: "CHECKSIGVERIFY",
  0xae: "CHECKMULTISIG", 0xb1: "CHECKLOCKTIMEVERIFY", 0xb2: "CHECKSEQUENCEVERIFY", 0xba: "CHECKSIGADD" };
// a key that is none of these is a tweaked covenant key, named by its own bytes
function keyName(x) {
  const known = [...(info ? [["server", info.serverPubkey], ["emulator", info.emulatorPubkey], ["delegatee", info.delegatePubkey]] : []),
    ...Object.entries(detail?.delegation.variables || {})];
  return known.find(([, k]) => k && (k.length === 64 || k.length === 66) && k.slice(-64) === x)?.[0] ?? "covenant·" + x.slice(0, 6);
}
const bytes = (hex) => Uint8Array.from(hex.match(/../g) ?? [], (h) => parseInt(h, 16));
// minimal little-endian, the top bit of the last byte is the sign
function scriptNum(b) {
  if (!b.length) return 0;
  const v = b.reduceRight((a, x, i) => a * 256 + (i === b.length - 1 ? x & 0x7f : x), 0);
  return b[b.length - 1] & 0x80 ? -v : v;
}
const bip68 = (v) => (v & (1 << 22) ? span((v & 0xffff) * 512) : (v & 0xffff) + " blocks");
function variable(name, type, hex) {
  if (type !== "int") return `<span class="hash" title="${esc(hex)}">${esc(short(hex, 10))}</span>${hex.length > 21 ? `<button class="mini" data-copy="${esc(hex)}" title="Copy ${esc(name)}">copy</button>` : ""}`;
  const n = scriptNum(bytes(hex));
  const text = /delay/.test(name) ? bip68(n) : /window/.test(name) ? span(n) : /fee/.test(name) ? sats(n) : n.toLocaleString();
  return `<span class="n" title="script number 0x${esc(hex) || "(empty)"}">${esc(text)}</span>`;
}
function scriptWords(hex) {
  const b = bytes(hex), out = [];
  for (let i = 0; i < b.length;) {
    const op = b[i++];
    let n = op > 0 && op <= 0x4b ? op : op === 0x4c ? b[i++] : op === 0x4d ? b[i] | (b[i + 1] << 8) : -1;
    if (op === 0x4d) i += 2;
    if (n < 0) { out.push(op === 0 ? "0" : op >= 0x51 && op <= 0x60 ? String(op - 0x50) : OPS[op] ?? "OP_" + op.toString(16)); continue; }
    const data = Array.from(b.slice(i, i + n), (x) => x.toString(16).padStart(2, "0")).join(""); i += n;
    if (n === 32) { out.push(keyName(data)); continue; }
    const next = b[i], v = scriptNum(b.slice(i - n, i));
    if (next === 0xb2) out.push("after " + bip68(v));
    else if (next === 0xb1) out.push(v < 500_000_000 ? "from block " + v.toLocaleString() : "from " + new Date(v * 1000).toLocaleDateString());
    else out.push(n <= 8 ? String(v) : short(data, 6));
  }
  return out.join(" ");
}

// a watch boards an onchain coin, the rest renew VTXOs
const boards = (delegation) => (delegation.slots || []).some((s) => s.onchain);
// a spend binds coins until it expires, as RegisterSpend does
const spends = (delegation) => !delegation.address && num(delegation.expiresAt) > 0;
const WATCH = { coins: "VTXOs at this address", stop: "Stop renewing", resume: "Resume renewing" };
const KINDS = {
  spend: { done: "spent", doing: "spending", attempts: "Spend attempts", coins: "Coins it spends", stop: "Cancel spend", resume: "Resume spend",
    noAttempt: "No attempt yet. A spend runs at the next scan.", noCoin: "No coin left: the spend ran, or something else spent its coins." },
  boarding: { ...WATCH, done: "boarded", doing: "active", attempts: "Boarding attempts",
    noAttempt: "No attempt yet. A deposit is boarded once it confirms.", noCoin: "No deposit sits at this address right now." },
  renewal: { ...WATCH, done: "renewed", doing: "renewing", attempts: "Renewal attempts",
    noAttempt: "No attempt yet. A VTXO is first renewed in its renewal window.", noCoin: "No spendable VTXO sits at this address right now." },
};
const kindKey = (delegation) => (spends(delegation) ? "spend" : boards(delegation) ? "boarding" : "renewal");
const kindOf = (delegation) => KINDS[kindKey(delegation)];
function stateOf(d) {
  const r = d.lastRenewal, done = kindOf(d.delegation).done;
  if (d.delegation.status !== "active") return { key: "off", dot: "off", text: d.delegation.status === "cancelled" ? "stopped" : d.delegation.status === "done" ? done : d.delegation.status };
  if (d.unmanagedReason)
    return { key: "bad", dot: "bad", skipped: true, text: d.unmanagedReason, why: "The scanner skips it: " + d.unmanagedReason + "." };
  if (d.renewing) return { key: "ok", dot: "renewing", text: "in a batch now", why: "A batch session holds its coins; the result shows up when it ends." };
  if (r && !r.success) return { key: "bad", dot: "bad", text: "failed " + ago(r.attemptedAt), why: r.error };
  // overdue: its planned batch time passed and it is still here
  const left = num(d.nextExpiry) - nowSecs(), at = num(d.nextBatchAt), overdue = at ? nowSecs() - at : 0;
  if (num(d.nextExpiry) && left <= 0)
    return { key: "late", dot: "late", text: "expired " + ago(d.nextExpiry), why: "A VTXO expired without being renewed." };
  if (overdue > 0)
    return { key: "late", dot: "late", text: "overdue by " + span(overdue), why: "Past its deadline and not renewed: check that arkd rounds are running." };
  if (!r) return { key: "ok", dot: "", text: "not " + done + " yet" };
  return { key: "ok", dot: "ok", text: done + " " + ago(r.attemptedAt) };
}
const needsAttention = (d) => ["bad", "late"].includes(stateOf(d).key);
const MAX_ROWS = 300; // the first ones in the chosen order
const MAX_LANES = 12, MAX_VTXOS = 40, MAX_BATCHES = 8, MAX_ATTENTION = 6, AXIS_UNIT = 600; // ten minutes: the horizon's finest step
const URGENCY = { bad: 0, late: 1, ok: 2, off: 3 };
const FILTERS = [
  ["attention", "Attention", needsAttention],
  ["active", "Active", (d) => d.delegation.status === "active"],
  ["cancelled", "Ended", (d) => d.delegation.status !== "active"],
  ["all", "All", () => true],
];

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || res.statusText);
  return body;
}
const send = (method, path, body) => api(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const act = (request, done, failed) => request.then(() => { toast(done); refresh(); return true; }, (e) => { toast(failed + e.message, true); return false; });

// ask opens the confirmation dialog and resolves to whether the operator said yes
function ask(title, text, yes, no = "Cancel") {
  const d = $("confirm");
  $("confirm-title").textContent = title; $("confirm-text").textContent = text;
  $("confirm-yes").textContent = yes; $("confirm-no").textContent = no;
  d.returnValue = ""; d.showModal();
  return new Promise((resolve) => d.addEventListener("close", () => resolve(d.returnValue === "yes"), { once: true }));
}

function jsonHtml(v, pad = "") {
  const p = (c) => `<span class="j-p">${c}</span>`, inner = pad + "  ";
  if (v === null || typeof v !== "object") return `<span class="${typeof v === "string" ? "j-s" : typeof v === "number" ? "j-n" : "j-b"}">${esc(JSON.stringify(v))}</span>`;
  const entries = Object.entries(v), [open, close] = Array.isArray(v) ? "[]" : "{}";
  if (!entries.length) return p(open + close);
  const item = ([k, x]) => (Array.isArray(v) ? "" : `<span class="j-k">${esc(JSON.stringify(k))}</span>${p(":")} `) + jsonHtml(x, inner);
  if (Array.isArray(v) && v.every((x) => x === null || typeof x !== "object") && JSON.stringify(v).length < 100)
    return p("[") + entries.map(item).join(p(",") + " ") + p("]");
  return p(open) + "\n" + entries.map((e) => inner + item(e)).join(p(",") + "\n") + "\n" + pad + p(close);
}
function documentView(document) {
  if (document === undefined) return skeleton(4);
  let body;
  try { body = jsonHtml(JSON.parse(document)); } catch { body = esc(document); }
  return `<div class="doc"><div class="bar"><span>${(document.length / 1024).toFixed(1)} KiB</span>
    <button class="mini" data-copy="${esc(document)}">copy</button></div><pre>${body}</pre></div>`;
}

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 4000);
}

function span(s) {
  s = Math.abs(s);
  const [n, u] = s < 90 ? [s, " s"] : s < 5400 ? [s / 60, " min"] : s < 129600 ? [s / 3600, " h"] : [s / 86400, " d"];
  return Math.round(n) + u;
}
function ago(ts) {
  const s = nowSecs() - num(ts);
  return s < 0 ? "in " + span(s) : span(s) + " ago";
}
// logScale maps seconds from now to a percent of an axis reaching far, so that the near end stays readable
function logScale(far) {
  return (x) => Math.log1p(Math.max(0, x) / AXIS_UNIT) / Math.log1p(far / AXIS_UNIT) * 100;
}
// ticks are the round spans before far that sit apart on the axis
function ticks(far, pct) {
  const out = [];
  for (const t of [600, 3600, 6 * 3600, 86400, 3 * 86400, 7 * 86400, 14 * 86400, 30 * 86400, 90 * 86400])
    if (t < far * 0.9 && pct(t) - (out.length ? pct(out[out.length - 1]) : 0) >= 9) out.push(t);
  return `<i style="left:0">now</i>${out.map((t) => `<i style="left:${pct(t)}%">${span(t)}</i>`).join("")}`;
}

async function loadMeta() {
  try {
    const i = await api("/v1/info");
    info = i;
    $("meta").innerHTML = `<span class="net">${esc(i.network)}</span><span class="ver">${esc(i.version)}</span>
      <span class="key">key <button title="Copy the delegate public key" data-copy="${esc(i.delegatePubkey)}">${esc(short(i.delegatePubkey, 6))}</button></span>`;
  } catch { /* the health dot says why */ }
}

async function loadHealth() {
  const h = $("health");
  let ok = false, text = "delegateed is unreachable";
  try {
    const r = await fetch("/healthz");
    ok = r.ok && (await r.json()).status === "SERVING";
    text = ok ? "arkd, emulator and database reachable" : "A dependency is unreachable, check the logs";
  } catch { /* unreachable */ }
  h.className = ok ? "ok" : "down";
  h.dataset.tip = text; h.setAttribute("aria-label", text);
}

async function loadDelegations() {
  const rows = [];
  let cursor = 0;
  do {
    const page = await api("/v1/admin/delegate?page_size=1000" + (cursor ? "&cursor=" + cursor : ""));
    rows.push(...(page.delegations || []));
    cursor = num(page.nextCursor);
  } while (cursor && rows.length < loadLimit);
  moreRows = Boolean(cursor);
  return rows;
}

async function loadList() {
  try {
    [status, delegations, { templates = [] }, { artifacts = [] }] = await Promise.all([
      api("/v1/admin/status"), loadDelegations(), api("/v1/admin/template"), api("/v1/admin/artifact"),
    ]);
  } catch (e) { return toast("Could not load delegations: " + e.message, true); }
  templates = templates.map((t) => ({ ...t.template, ...t }));
  usedBy = {};
  for (const t of templates) for (const a of t.artifactIds || []) (usedBy[a] ||= []).push(t.id);
  if (!filter) filter = delegations.some(needsAttention) ? "attention" : "active";
}

function parseRoute() {
  const h = location.hash.slice(1), [head, ...rest] = h.split("/");
  selected = csel = "";
  if (head === "id" || /^t?ark1/.test(h)) { page = "delegations"; selected = h; }
  else if (head === "delegations") page = "delegations";
  else if (head === "templates" || head === "artifacts") { page = "catalog"; ctab = head; csel = decodeURIComponent(rest.join("/")); }
  else page = "overview";
}
const go = (hash) => { location.hash = hash || ""; if (!hash) history.replaceState(null, "", location.pathname); };

function render() {
  for (const id of ["overview", "delegations", "catalog"]) $(id).hidden = id !== page;
  for (const a of document.querySelectorAll("nav a")) a.dataset.page === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  $("tooltip").hidden = true;
  if (!status) return;
  renderHeader();
  if (page === "overview") renderOverview();
  else if (page === "delegations") { renderList(); loadDetail(); }
  else { renderCatalog(); loadCatalogDetail(); }
}

function scanState() {
  const poll = num(status.pollInterval), last = num(status.lastScanAt), busy = status.renewingVtxos > 0;
  return { poll, last, busy, stale: !busy && last > 0 && nowSecs() - last > Math.max(3 * poll, 30) };
}

function renderHeader() {
  const { busy, stale, last } = scanState(), next = (status.batches || [])[0], p = $("pulse");
  p.className = busy ? "busy" : stale ? "warn" : "";
  p.innerHTML = busy ? `<i class="pulse"></i>Renewing <b>${plural(status.renewingVtxos, "VTXO")}</b>`
    : stale ? `Scanner stalled, last scan <b>${ago(last)}</b>`
    : next ? `Next batch <b>${num(next.at) <= nowSecs() ? "now" : ago(next.at)}</b>, ${plural(next.vtxoCount, "VTXO")}`
    : !last ? "First scan pending" : "No batch planned";
  p.hidden = false;
  const n = delegations.filter(needsAttention).length;
  $("nav-attention").hidden = !n; $("nav-attention").textContent = n;
}

function renderOverview() {
  const now = nowSecs(), { poll, last, busy, stale } = scanState();
  const active = delegations.filter((d) => d.delegation.status === "active"), managed = active.filter((d) => d.managed);
  const total = managed.reduce((a, d) => a + num(d.totalAmount), 0), vtxos = managed.reduce((a, d) => a + num(d.vtxoCount), 0);
  const kinds = ["renewal", "boarding", "spend"].map((k) => [k, active.filter((d) => kindKey(d.delegation) === k).length]).filter(([, n]) => n);
  const attention = delegations.filter(needsAttention).sort(SORTS.urgency), failing = attention.filter((d) => stateOf(d).key === "bad").length;
  const recent = delegations.filter((d) => d.lastRenewal && now - num(d.lastRenewal.attemptedAt) < 86400), served = recent.filter((d) => d.lastRenewal.success).length;
  const enabled = templates.filter((t) => t.status === "active").length, broken = templates.filter((t) => t.failures > 0).length;
  const strangers = delegations.filter((d) => d.unmanagedReason === "registered under another key").length;

  const stats = `<div class="stats">
    <div class="stat"><span class="label">Under watch</span><span class="fig" title="${(total / 1e8).toFixed(8)} BTC">${total.toLocaleString()}<small>sats</small></span><span class="sub">${plural(vtxos, "VTXO")}</span></div>
    <button class="stat" data-go="delegations" data-filter="active"><span class="label">Active delegations</span><span class="fig">${active.length.toLocaleString()}</span><span class="sub">${kinds.map(([k, n]) => `${n.toLocaleString()} ${k}`).join(", ") || "none yet"}</span></button>
    <button class="stat ${attention.length ? "alert" : ""}" data-go="delegations" data-filter="attention"><span class="label">Needs attention</span><span class="fig">${attention.length.toLocaleString()}</span><span class="sub">${attention.length ? `${failing.toLocaleString()} failing, ${(attention.length - failing).toLocaleString()} late` : "everything on time"}</span></button>
    <div class="stat"><span class="label">Served, last 24 h</span><span class="fig">${served.toLocaleString()}</span><span class="sub">${recent.length - served ? `${(recent.length - served).toLocaleString()} failed their last attempt` : "no failure"}</span></div>
    <button class="stat" data-go="templates"><span class="label">Templates</span><span class="fig">${enabled.toLocaleString()}<small>active</small></span><span class="sub">${(templates.length - enabled).toLocaleString()} disabled${broken ? `, ${broken.toLocaleString()} failing` : ""}</span></button>
  </div>`;

  $("overview").innerHTML = `
    <div class="ov-head"><h2>Overview</h2>
      <p class="${stale ? "warn" : ""}">${!last ? "First scan pending" : `Scanned ${ago(last)}, ${stale ? `expected every ${span(poll)}` : `every ${span(poll)}`}`}</p></div>
    ${strangers ? `<p class="note"><b>${plural(strangers, "active delegation")}</b> registered under another delegate key cannot be renewed by this instance. ${tip("If the key was rotated by mistake, restore the previous key in the configured keyring.")}</p>` : ""}
    ${stats}
    ${batchesPanel(now, busy)}
    <div class="cols">
      ${expiryPanel(managed, now)}
      <section class="panel"><div class="ph"><h3>Needs attention</h3>${attention.length ? `<span class="aside">${plural(attention.length, "delegation")}</span>` : ""}</div>
        ${attention.length ? `<ul class="attn">${attention.slice(0, MAX_ATTENTION).map((d) => {
          const st = stateOf(d);
          return `<li><button data-go="id/${esc(d.delegation.id)}" title="${esc(st.why || st.text)}"><span class="dot ${st.dot}"></span><span class="hash">${esc(label(d))}</span>
            <span class="why">${esc(st.text)}</span><span class="amt">${num(d.vtxoCount) ? sats(d.totalAmount) : ""}</span></button></li>`;
        }).join("")}</ul>${attention.length > MAX_ATTENTION ? `<p class="more"><button class="link" data-go="delegations" data-filter="attention">See all ${attention.length.toLocaleString()}</button></p>` : ""}`
        : `<p class="calm"><span class="dot ok"></span>Every active delegation runs on time.</p>`}
      </section>
    </div>
    ${horizonPanel(managed, now)}
    ${daemonPanel()}`;
}

function batchesPanel(now, busy) {
  const batches = status.batches || [], first = batches[0], byId = Object.fromEntries(delegations.map((d) => [num(d.delegation.id), d]));
  const amount = batches.reduce((a, b) => a + num(b.totalAmount), 0);
  const next = busy ? `<div class="next"><span class="label"><i class="pulse"></i>In progress</span><div class="when busy">Renewing now</div><p><b>${plural(status.renewingVtxos, "VTXO")}</b> in a batch session</p></div>`
    : first ? `<div class="next"><span class="label">Next batch</span><div class="when">${num(first.at) <= now ? "now" : ago(first.at)}</div>
        <p><b>${plural(first.vtxoCount, "VTXO")}</b> from ${plural(first.delegationCount, "delegation")}</p><p><b>${sats(first.totalAmount)}</b></p></div>`
    : `<div class="next"><span class="label">Next batch</span><div class="when">None planned</div><p>Nothing renewable is in sight.</p></div>`;
  let timeline = "";
  if (batches.length) {
    const far = Math.max(num(batches[batches.length - 1].at) - now, 2 * 3600), pct = logScale(far);
    const big = Math.max(...batches.map((b) => num(b.vtxoCount)), 1);
    let labelled = -Infinity;
    timeline = `<div class="tl" role="img" aria-label="${plural(batches.length, "planned batch", "planned batches")} over the next ${span(far)}"><div class="rail"></div>
      ${batches.map((b, i) => {
        const x = pct(num(b.at) - now), size = 10 + 18 * Math.sqrt(num(b.vtxoCount) / big), show = x - labelled >= 10;
        if (show) labelled = x;
        const text = `${num(b.at) <= now ? "Now" : ago(b.at)}: ${plural(b.vtxoCount, "VTXO")} from ${plural(b.delegationCount, "delegation")}, ${sats(b.totalAmount)}`;
        return `<button class="m ${i ? "" : "first"}" style="left:${x}%;--s:${size.toFixed(1)}px" data-go="id/${esc(b.forcedByDelegationId)}" data-tip="${esc(text)}" aria-label="${esc(text)}">${show ? `<span class="v">${num(b.vtxoCount).toLocaleString()}</span>` : ""}</button>`;
      }).join("")}
      <div class="axis">${ticks(far, pct)}</div></div>`;
  }
  const rows = (allBatches ? batches : batches.slice(0, MAX_BATCHES)).map((b) => {
    const at = num(b.at), d = byId[num(b.forcedByDelegationId)], expiry = d ? num(d.nextExpiry) : 0;
    return `<tr><td title="${esc(dateOf(at))}">${at <= now ? "now" : ago(b.at)}</td><td class="r">${num(b.vtxoCount).toLocaleString()}</td><td class="r">${num(b.delegationCount).toLocaleString()}</td>
      <td class="r">${sats(b.totalAmount)}</td>
      <td><button class="link hash" data-go="id/${esc(b.forcedByDelegationId)}" title="${esc(b.forcedByOutpoint)}">${esc(short(b.forcedByOutpoint, 8))}</button></td>
      <td class="r">${expiry > at ? span(expiry - at) : expiry ? "" : "deposit"}</td></tr>`;
  }).join("");
  return `<section class="panel"><div class="ph"><h3>Planned batches ${tip(`A batch is submitted ${span(num(status.renewalReserve))} before its first VTXO expires at the latest, and takes every VTXO renewable by then. Deposits wait at most ${span(num(status.boardingMaxWait))}.`)}</h3>
      ${batches.length ? `<span class="aside">${plural(batches.length, "batch", "batches")}, ${sats(amount)}</span>` : ""}</div>
    <div class="hero">${next}${timeline}</div>
    ${rows ? `<div class="scroll"><table><thead><tr><th>When</th><th class="r">VTXOs</th><th class="r">Delegations</th><th class="r">Amount</th>
      <th>Forced by ${tip("The VTXO whose deadline sets the batch time.")}</th><th class="r">Margin ${tip("How long before that VTXO expires the batch runs.")}</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${batches.length > MAX_BATCHES ? `<p class="more"><button class="link" id="all-batches">${allBatches ? "Show fewer" : `Show all ${batches.length}`}</button></p>` : ""}` : ""}
  </section>`;
}

const BUCKETS = [["Expired", 0], ["Under 1 h", 3600], ["1 to 6 h", 6 * 3600], ["6 to 24 h", 86400], ["1 to 3 days", 3 * 86400], ["3 to 7 days", 7 * 86400], ["Over a week", Infinity]];
function expiryPanel(managed, now) {
  const held = managed.filter((d) => num(d.nextExpiry));
  const buckets = BUCKETS.map(([name, upTo]) => ({ name, upTo, value: 0, count: 0 }));
  for (const d of held) {
    const b = buckets.find((x) => num(d.nextExpiry) - now <= x.upTo);
    b.value += num(d.totalAmount); b.count++;
  }
  const shown = buckets.filter((b) => b.count || b.upTo), top = Math.max(...shown.map((b) => b.value), 1);
  return `<section class="panel"><div class="ph"><h3>Value by earliest expiry ${tip("Each delegation's balance, counted at the expiry of its soonest VTXO.")}</h3></div>
    ${held.length ? `<div class="dist">${shown.map((b) => `<span>${b.name}</span><div class="bar ${b.upTo ? "" : "late"}" style="width:${(b.value / top) * 100}%" data-tip="${esc(`${plural(b.count, "delegation")}, ${sats(b.value)}`)}"></div>
      <span class="v">${b.value ? sats(b.value) : "none"}<small>${b.count.toLocaleString()}</small></span>`).join("")}</div>`
      : `<p class="calm">No VTXO is watched yet.</p>`}
  </section>`;
}

function horizonPanel(managed, now) {
  const held = managed.filter((d) => num(d.nextExpiry)).sort((a, b) => num(a.nextExpiry) - num(b.nextExpiry)), shown = held.slice(0, MAX_LANES);
  if (!shown.length) return "";
  const far = Math.max(...shown.map((d) => num(d.nextExpiry) - now), 2 * AXIS_UNIT), pct = logScale(far);
  const batches = status.batches || [], forcing = (at) => batches.find((b) => num(b.at) === at);
  const lanes = shown.map((d) => {
    const left = num(d.nextExpiry) - now, win = num(d.nextExpiry) - num(d.nextRenewalAt), st = stateOf(d);
    // the reserve starts at the deadline: the window's end when it is shorter than the reserve
    const deadline = Math.max(num(d.nextDeadline) - now, left - win), at = num(d.nextBatchAt), joins = at ? Math.max(at - now, 0) : null;
    const cls = left <= 0 || st.key !== "ok" ? "late" : st.dot === "renewing" ? "renewing" : left <= win ? "in" : "";
    const text = left <= 0 ? "expired " + ago(d.nextExpiry) : st.key === "bad" ? "not renewing, " + span(left) + " left"
      : st.dot === "renewing" ? "in the batch now" : st.key === "late" ? st.text
      : joins === null ? (left <= win ? "renewable now, not planned yet" : "renewable " + ago(d.nextRenewalAt))
      : `${left <= win ? "renewable now" : "renewable " + ago(d.nextRenewalAt)}, joins the batch ${joins ? ago(at) : "now"}${deadline - joins > 60 ? `, ${span(deadline - joins)} before its deadline` : ""}`;
    const forced = at && forcing(Math.max(at, Math.floor(now)))?.forcedByOutpoint;
    return `<button data-go="${esc("id/" + d.delegation.id)}" title="${esc(d.delegation.address)}">${esc(label(d, 12))}</button>
      <div class="lane ${left <= 0 ? "late" : ""}" role="img" aria-label="${esc(text)}, expires ${ago(d.nextExpiry)}" title="${forced ? esc("batch forced by " + short(forced, 8)) : ""}">
        <div class="left" style="width:${pct(left - win)}%"></div><div class="window" style="width:${pct(deadline) - pct(left - win)}%"></div><div class="reserve" style="width:${pct(left) - pct(deadline)}%"></div>
        ${joins === null || st.dot === "renewing" ? "" : `<i class="batch" style="left:${Math.min(pct(joins), 100)}%"></i>`}</div>
      <span class="t n ${cls}" title="${esc(text)}">${text}</span>`;
  }).join("");
  return `<section class="panel"><div class="ph"><h3>Next to expire ${tip("Each bar runs from now to the delegation's earliest expiry, on a log scale.")}</h3>
      ${held.length > shown.length ? `<span class="aside">${shown.length} soonest of ${held.length.toLocaleString()}</span>` : ""}</div>
    <div class="horizon">${lanes}<span></span><div class="axis">${ticks(far, pct)}</div><span></span></div>
    <p class="legend"><span><i></i>waiting</span><span><i class="w"></i>renewable</span><span><i class="r"></i>reserve, never submitted in</span><span><i class="b"></i>planned batch</span></p>
  </section>`;
}

function daemonPanel() {
  const f = status.intentFees, fees = f && [["Fee per VTXO renewed", f.offchainInput], ["Fee per output created", f.offchainOutput]];
  return `<section class="panel"><div class="ph"><h3>Daemon</h3></div><dl class="settings">
    <div><dt>Scan interval</dt><dd>${span(num(status.pollInterval))}</dd></div>
    <div><dt>Renewal reserve ${tip("The daemon never submits a VTXO this close to its expiry.")}</dt><dd>${span(num(status.renewalReserve))}</dd></div>
    <div><dt>Boarding max wait ${tip("The longest a confirmed deposit waits for a batch.")}</dt><dd>${span(num(status.boardingMaxWait))}</dd></div>
    ${!f ? `<div><dt>arkd intent fees</dt><dd class="state late">unknown, arkd is unreachable</dd></div>`
      : fees.map(([k, v]) => `<div><dt>${k} ${tip("arkd fee program, in sats. A delegation whose template caps its fee lower is skipped.")}</dt><dd class="${charges(v) ? "hash" : ""}">${charges(v) ? esc(v) : "free"}</dd></div>`).join("")}
  </dl></section>`;
}

let kindFilter = "all";
// addresses of one server share their first characters: the tail tells them apart
const label = (d, n = 16) => {
  const address = d.delegation.address, parent = num(d.delegation.parentId);
  return address ? "…" + address.slice(-n) : parent ? `#${d.delegation.id} successor of #${parent}` : `#${d.delegation.id}`;
};
// a delegation matches its address, #id, template id, a variable value or a bound outpoint
const matches = (d, q) => {
  const x = d.delegation;
  return !q || q.replace("#", "") === String(x.id) || [x.address, x.templateId, ...Object.values(x.variables || {}), ...(x.slots || []).map((s) => s.outpoint || "")]
    .some((v) => v && v.toLowerCase().includes(q));
};
const SORTS = {
  urgency: (a, b) => URGENCY[stateOf(a).key] - URGENCY[stateOf(b).key] || (num(a.nextExpiry) || Infinity) - (num(b.nextExpiry) || Infinity),
  amount: (a, b) => num(b.totalAmount) - num(a.totalAmount),
  newest: (a, b) => num(b.delegation.createdAt) - num(a.delegation.createdAt),
};
function visibleRows() {
  const q = $("search").value.trim().toLowerCase(), fn = FILTERS.find((f) => f[0] === filter)[2];
  return delegations.filter((d) => fn(d) && (kindFilter === "all" || kindKey(d.delegation) === kindFilter) && matches(d, q)).sort(SORTS[$("sort").value]);
}
// nextOf says what comes next for an active delegation, else what happened last
function nextOf(d, st) {
  const k = kindOf(d.delegation), at = num(d.nextBatchAt), due = num(d.nextRenewalAt);
  if (st.key !== "ok" || st.dot === "renewing" || d.delegation.status !== "active") return st.why || st.text;
  if (at) return (at <= nowSecs() ? "joins a batch now" : "joins a batch " + ago(at));
  if (due && k === KINDS.renewal) return (due <= nowSecs() ? "renewable now" : "renews " + ago(due));
  return st.text;
}

function renderList() {
  $("filters").innerHTML = FILTERS.map(([id, name, fn]) => {
    const n = delegations.filter(fn).length;
    return `<button data-filter="${id}" aria-pressed="${id === filter}" class="${id === "attention" && n ? "alert" : ""}">${name} <span class="n">${n.toLocaleString()}</span></button>`;
  }).join("");
  const inFilter = delegations.filter(FILTERS.find((f) => f[0] === filter)[2]);
  $("kinds").innerHTML = [["all", "All"], ["renewal", "Renewal"], ["boarding", "Boarding"], ["spend", "Spend"]].map(([id, name]) => {
    const n = id === "all" ? inFilter.length : inFilter.filter((d) => kindKey(d.delegation) === id).length;
    return n || id === "all" || id === kindFilter ? `<button data-kind="${id}" aria-pressed="${id === kindFilter}">${name}<span class="n">${n.toLocaleString()}</span></button>` : "";
  }).join("");
  $("kinds").classList.toggle("more", $("kinds").scrollWidth > $("kinds").clientWidth);
  const rows = visibleRows();
  $("shown").textContent = `${rows.length.toLocaleString()} shown, ${sats(rows.reduce((a, d) => a + num(d.totalAmount), 0))}`;
  if (!rows.length) {
    $("rows").innerHTML = `<li class="empty">${$("search").value.trim() ? "Nothing matches your search."
      : filter === "attention" ? "Nothing needs attention: every active delegation runs on time."
      : delegations.length ? "No delegations here."
      : "No delegations yet. Wallets register them on the public port."}</li>`;
    return;
  }
  const more = rows.length - MAX_ROWS;
  $("rows").innerHTML = rows.slice(0, MAX_ROWS).map((d) => {
    const st = stateOf(d), selection = "id/" + d.delegation.id;
    const kind = kindKey(d.delegation), coins = num(d.vtxoCount), next = nextOf(d, st);
    return `<li><button data-go="${esc(selection)}" aria-current="${selection === selected}" title="${esc(d.delegation.address || "#" + d.delegation.id)}">
      <span class="dot ${st.dot}"></span><span class="hash">${esc(label(d))}</span><span class="amt">${coins ? sats(d.totalAmount) : ""}</span>
      <span></span><span class="sub ${st.key !== "ok" ? st.key : st.dot}" title="${esc(next)}"><span class="kind">${kind}</span>, ${esc(next)}</span><span class="count">${coins ? plural(coins, "coin") : ""}</span></button></li>`;
  }).join("") + (more > 0 ? `<li class="empty">${more.toLocaleString()} more. Search or filter to narrow down.</li>` : "")
    + (moreRows ? `<li class="empty">Only the newest ${delegations.length.toLocaleString()} delegations are loaded. <button class="link" id="load-more">Load more</button></li>` : "");
  $("rows").querySelector("[aria-current=true]")?.scrollIntoView({ block: "nearest" });
}

async function loadDetail() {
  if (!selected) {
    detail = null;
    $("detail").removeAttribute("aria-busy");
    $("detail").innerHTML = `<div class="blank"><b>No delegation selected</b><p>Pick one in the list to see its coins, attempts and inputs.</p></div>`;
    return;
  }
  const address = selected;
  if ("id/" + detail?.delegation.id !== address) {
    allVtxos = false;
    $("detail").setAttribute("aria-busy", "true");
    $("detail").innerHTML = `<h2 class="hash" style="font-size:.95rem;color:var(--muted)">${esc(short(address, 12))}</h2>${skeleton(5)}`;
  }
  try {
    detail = await api(address.startsWith("id/") ? "/v1/admin/delegation/" + encodeURIComponent(address.slice(3)) : "/v1/delegate/" + encodeURIComponent(address));
  } catch (e) {
    $("detail").removeAttribute("aria-busy");
    $("detail").innerHTML = `<p class="empty">Could not load ${esc(short(address, 12))}: ${esc(e.message)}. <button class="link" data-go="delegations">Back to the list</button></p>`;
    return;
  }
  if (address !== selected) return; // the operator moved on while this was loading
  $("detail").removeAttribute("aria-busy");
  renderDetail();
}

// batchAt is the planned batch time, 0 without one; renewing when a session holds the delegation
function lifeBar(v, batchAt, renewing, company) {
  const now = nowSecs(), at = num(batchAt);
  const joins = renewing ? "in the batch now" : !at ? "" : at <= now ? `overdue by ${span(now - at)}` : `joins the batch ${ago(at)}${company}`;
  if (!num(v.expiresAt)) return `<div class="state ${renewing ? "renewing" : at && at <= now ? "late" : ""}">onchain, ${joins || `boarded at the next batch${num(v.renewableAt) ? " from " + ago(v.renewableAt) : ""}`}</div>`;
  const born = num(v.createdAt), dies = num(v.expiresAt), windowSecs = dies - num(v.renewableAt), reserve = num(status?.renewalReserve);
  const life = Math.max(dies - born, 1), pct = (x) => Math.min(100, Math.max(0, (x / life) * 100)), left = dies - now;
  const deadline = Math.max(num(v.renewableAt), dies - reserve);
  const [cls, text] = left <= 0 ? ["late", `expired ${ago(dies)}`]
    : renewing ? ["renewing", joins]
    : at && at <= now ? ["late", joins]
    : num(v.renewableAt) >= dies ? ["late", "cannot be renewed before it expires"]
    : left <= windowSecs ? ["in", `renewable since ${span(now - num(v.renewableAt))}, ${joins || "not planned yet: waiting for a locktime or confirmations"}`]
    : ["", `renewable ${ago(v.renewableAt)}, ${joins || "not planned yet"}`];
  return `<div class="life" role="img" aria-label="${esc(text)}, expires ${ago(dies)}">
      <div class="elapsed" style="width:${pct(now - born)}%"></div>
      <div class="window" style="width:${pct(windowSecs)}%"></div>
      <div class="reserve" style="width:${pct(dies - deadline)}%"></div>
      <div class="now" style="left:${pct(now - born)}%"></div>
      ${at && !renewing ? `<i class="batch" style="left:${pct(Math.max(at, now) - born)}%"></i>` : ""}
    </div><div class="state ${cls}">${text}, expires ${ago(dies)}${v.preconfirmed ? ", not in a batch yet" : ""}</div>`;
}

function renderDetail() {
  const d = detail.delegation, renewals = detail.renewals || [];
  const vtxos = (detail.vtxos || []).slice().sort((a, b) => num(a.renewableAt) - num(b.renewableAt));
  const held = vtxos.reduce((a, v) => a + num(v.amount), 0), shownVtxos = allVtxos ? vtxos : vtxos.slice(0, MAX_VTXOS);
  const active = d.status === "active";
  const inList = delegations.find((x) => x.delegation.id === d.id), st = inList && stateOf(inList);
  const slots = d.slots || [], kind = kindOf(d), spend = kind === KINDS.spend, done = kind.done;
  const types = Object.fromEntries((templates.find((t) => t.id === d.templateId)?.params || []).map((p) => [p.name, p.type]));

  // who else is in a vtxo's batch: the others here, and the batch's count when it is among the ones listed
  const company = (v) => {
    const at = num(batchAt[v.outpoint]), here = vtxos.filter((x) => num(batchAt[x.outpoint]) === at).length - 1;
    const b = (status?.batches || []).find((x) => num(x.at) === Math.max(at, Math.floor(nowSecs())));
    const elsewhere = b ? num(b.vtxoCount) - here - 1 : 0;
    return !at || (!here && !elsewhere) ? "" : ` with ${here ? `${here} other${here > 1 ? "s" : ""} here` : ""}${here && elsewhere ? " and " : ""}${elsewhere ? `${elsewhere} elsewhere` : ""}`;
  };
  $("detail").innerHTML = `
    <div class="title">
      <div><h2>Delegation ${esc(d.id)} <span class="badge ${!active ? "off" : st?.key === "bad" ? "bad" : st?.key === "late" ? "late" : st?.dot === "renewing" ? "renewing" : "ok"}">${!active ? (d.status === "cancelled" ? "stopped by an operator" : d.status === "done" ? done : esc(d.status)) : st?.skipped ? esc(st.text) : st?.key === "bad" ? (spend ? "failing" : "not renewing") : st?.key === "late" ? "overdue" : st?.dot === "renewing" ? "in a batch now" : kind.doing}</span></h2>
        ${d.address ? `<div class="hash">${esc(d.address)}</div>` : ""}</div>

        ${explorer() && /^t?ark1/.test(d.address) ? `<button data-open="${esc(explorer() + "/address/" + d.address)}">View in explorer</button>` : ""}
        ${active ? `<button class="danger" id="stop">${kind.stop}</button>` : d.status === "cancelled" ? `<button class="primary" id="resume">${kind.resume}</button>` : ""}</div>
    </div>
    <dl class="facts"><div><dt>Template</dt><dd class="hash" title="${esc(d.templateId)}"><button class="link hash" data-go="templates/${esc(d.templateId)}">${esc(short(d.templateId, 8))}</button><button class="mini" data-copy="${esc(d.templateId)}" title="Copy the template id">copy</button></dd></div>
      ${num(d.parentId) ? `<div><dt>Successor of</dt><dd><a href="#id/${num(d.parentId)}">#${num(d.parentId)}</a></dd></div>` : ""}
      ${Object.entries(d.variables || {}).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${variable(k, types[k], v)}</dd></div>`).join("")}
      <div><dt>Registered</dt><dd title="${esc(dateOf(d.createdAt))}">${ago(d.createdAt)}</dd></div>
      <div><dt>Expires</dt><dd>${num(d.expiresAt) ? `<span title="${esc(dateOf(d.expiresAt))}">${ago(d.expiresAt)}</span>` : "never"}</dd></div></dl>
    ${st?.why && active ? `<p class="note">${esc(st.why)}</p>` : ""}
    <h3>${kind.coins} ${vtxos.length && kind === KINDS.renewal ? tip(`A renewable VTXO waits for the batch of the first one to reach its deadline, ${span(reserve)} before expiry, so that they renew together. The dot is that batch.`) : ""}
      ${vtxos.length > 1 ? `<span class="aside">${vtxos.length} VTXOs, ${sats(held)}</span>` : ""}</h3>
    ${vtxos.length ? shownVtxos.map((v) => `<div class="vtxo"><div class="top"><span class="hash">${explore(v.outpoint)}</span>
        <span class="amount n">${sats(v.amount)}${(v.assets || []).map((a) => ` + ${num(a.amount).toLocaleString()} of ${esc(short(a.assetId, 6))}`).join("")}</span></div>

async function setRenewing(on) {
  const d = detail.delegation;
  $("detail").querySelector("#stop, #resume")?.setAttribute("aria-busy", "true");
  try {
    if (on) await send("POST", "/v1/admin/delegation/" + encodeURIComponent(d.id) + "/resume", {});
    else await api("/v1/admin/delegation/" + encodeURIComponent(d.id), { method: "DELETE" });
    toast(on ? "Resumed" : spends(d) ? "Spend cancelled" : "Renewing stopped");
  } catch (e) { toast(`Could not ${on ? "resume" : "stop"} it: ${e.message}`, true); }
  refresh();
}

function askStop() {
  const held = delegations.find((x) => x.delegation.id === detail.delegation.id), spend = spends(detail.delegation);
  ask(spend ? "Cancel this spend?" : "Stop renewing this address?",
    spend ? "The daemon stops trying it: its coins stay with their owner, who can sign a new spend. Nothing is deleted." : (num(held?.vtxoCount)
      ? `${sats(held.totalAmount)} in ${plural(held.vtxoCount, "VTXO")}, the first expiring ${ago(held.nextExpiry)}, will expire`
      : "Coins sent to it later will expire") + " unless the owner exits or you resume. The owner cannot register it again until you resume. Nothing is deleted.",
    kindOf(detail.delegation).stop, spend ? "Keep the spend" : "Keep renewing").then((yes) => yes && setRenewing(false));
}

// templates and artifacts
const docs = {}; // "templates/id": document, immutable once registered
const TPL = {
  filters: [["all", "All", () => true], ["active", "Active", (t) => t.status === "active"], ["disabled", "Disabled", (t) => t.status !== "active"],
    ["failing", "Failing", (t) => t.failures > 0], ["trusted", "Trusted", (t) => t.trusted], ["unused", "Unused", (t) => !num(t.delegations)]],
  sorts: [["used", "Most used", (a, b) => num(b.delegations) - num(a.delegations) || num(b.createdAt) - num(a.createdAt)],
    ["newest", "Newest", (a, b) => num(b.createdAt) - num(a.createdAt)], ["failures", "Failures", (a, b) => b.failures - a.failures || num(b.delegations) - num(a.delegations)]],
  matches: (t, q) => [t.id, ...(t.params || []).map((p) => p.name), ...(t.artifactIds || [])].some((v) => v.toLowerCase().includes(q)),
  placeholder: "Template id, variable or artifact id",
};
const ART = {
  filters: [["all", "All", () => true], ["used", "In use", (a) => usedBy[a.id]], ["unused", "Unused", (a) => !usedBy[a.id]]],
  sorts: [["newest", "Newest", (a, b) => num(b.createdAt) - num(a.createdAt)], ["used", "Most used", (a, b) => (usedBy[b.id]?.length || 0) - (usedBy[a.id]?.length || 0)]],
  matches: (a, q) => a.id.includes(q),
  placeholder: "Artifact id",
};
const cstate = { templates: { filter: "all", sort: "used", q: "" }, artifacts: { filter: "all", sort: "newest", q: "" } };
const catalogOf = () => (ctab === "templates" ? [TPL, templates] : [ART, artifacts]);
function catalogRows() {
  const [c, items] = catalogOf(), s = cstate[ctab], q = s.q.trim().toLowerCase(), fn = c.filters.find((f) => f[0] === s.filter)[2];
  return items.filter((x) => fn(x) && (!q || c.matches(x, q))).sort(c.sorts.find((x) => x[0] === s.sort)[2]);
}

function renderCatalog() {
  const [c, items] = catalogOf(), s = cstate[ctab];

    `<button data-go="${id}" aria-pressed="${id === ctab}">${name} <span class="n">${list.length.toLocaleString()}</span></button>`).join("");

  $("cfilters").classList.toggle("more", $("cfilters").scrollWidth > $("cfilters").clientWidth);

        <span class="amt">${n ? n.toLocaleString() : ""}</span><span></span><span class="sub">registered ${ago(x.createdAt)}</span><span class="count">${n ? (n === 1 ? "template" : "templates") : "unused"}</span></button></li>`;

  }).join("") + (more > 0 ? `<li class="empty">${more.toLocaleString()} more. Search or filter to narrow down.</li>` : "");
  $("crows").querySelector("[aria-current=true]")?.scrollIntoView({ block: "nearest" });
}

async function loadCatalogDetail() {
  renderCatalogDetail();
  const key = ctab + "/" + csel;
  if (!csel || key in docs) return;
  try {
    const r = await api(`/v1/${ctab === "templates" ? "template" : "artifact"}/` + encodeURIComponent(csel));
    docs[key] = (r.template || r.artifact).document;
  } catch (e) { return toast("Could not load the document: " + e.message, true); }
  if (key === ctab + "/" + csel) renderCatalogDetail();
}

function renderCatalogDetail() {
  const box = $("cdetail");
  // don't wipe a half-typed form on refresh
  if (!csel && box.querySelector(".register")?.document.value) return;
  if (!csel) return (box.innerHTML = catalogHome());
  const doc = docs[ctab + "/" + csel];
  if (ctab === "templates") {
    const t = templates.find((x) => x.id === csel);
    box.innerHTML = t ? templateView(t, doc) : missing("template");
  } else {
    const a = artifacts.find((x) => x.id === csel);
    box.innerHTML = a ? artifactView(a, doc) : missing("artifact");
  }
}

    ["Failing", templates.filter((t) => t.failures > 0).length, "failing"], ["Trusted", templates.filter((t) => t.trusted).length, "trusted"]]
    : [["Registered", artifacts.length, "all"], ["In use", artifacts.filter((a) => usedBy[a.id]).length, "used"], ["Unused", artifacts.filter((a) => !usedBy[a.id]).length, "unused"]];

    <section class="panel"><div class="ph"><h3>Register a document ${tip("The same public endpoints developers use, POST /v1/template and POST /v1/artifact, served on this port.")}</h3></div>
      <form class="register"><textarea name="document" placeholder='{"format": "..."}' aria-label="Document"></textarea>
        <div class="actions"><button class="${tpl ? "primary" : ""}" value="template">Register template</button><button class="${tpl ? "" : "primary"}" value="artifact">Register artifact</button></div></form></section>`;

  return `<div class="title"><div><h2>Template <span class="hash" style="font-size:.8em">${esc(short(t.id, 6))}</span>
        <span class="badge ${!on ? "off" : t.failures ? "bad" : "ok"}">${on ? (t.failures ? "failing" : "active") : "disabled"}</span>${t.trusted ? `<span class="badge accent">trusted</span>` : ""}</h2>

function artifactView(a, doc) {

    ${fns.length ? `<h3>Functions</h3><ul class="refs">${fns.map((f) => `<li><span class="tag">${esc(f.name)}</span></li>`).join("")}</ul>` : ""}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.filter) filter = b.dataset.filter;
  if (b.dataset.search !== undefined) { $("search").value = b.dataset.search; kindFilter = "all"; }
  if (b.dataset.go !== undefined) {
    const same = location.hash.slice(1) === b.dataset.go;
    go(b.dataset.go);
    if (same) render();
  }
  else if (b.dataset.filter) renderList();
  else if (b.dataset.kind) { kindFilter = b.dataset.kind; renderList(); }
  else if (b.dataset.cfilter) { cstate[ctab].filter = b.dataset.cfilter; renderCatalog(); }
  else if (b.dataset.open) window.open(b.dataset.open, "_blank", "noopener");
  else if (b.dataset.copy) navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Copied"), () => toast("Copy failed, select the text instead", true));
  else if (b.id === "all-vtxos") { allVtxos = true; renderDetail(); }
  else if (b.id === "all-batches") { allBatches = !allBatches; renderOverview(); }
  else if (b.id === "stop") askStop();
  else if (b.id === "resume") setRenewing(true);
  else if (b.id === "load-more") { loadLimit += 5000; refresh(); }
  else if (b.dataset.templateStatus) act(send("PUT", "/v1/admin/template/" + encodeURIComponent(b.dataset.id) + "/status", { status: b.dataset.templateStatus }),
    b.dataset.templateStatus === "active" ? "Template enabled" : "Template disabled", "Could not change the template: ");
  else if (b.dataset.templateTrusted) {
    const trust = b.dataset.templateTrusted === "true", id = b.dataset.id;
    (trust ? ask("Trust this template?", "The daemon will sign its delegate-key leaves and never disable it for failures.", "Trust") : Promise.resolve(true))
      .then((yes) => yes && act(send("PUT", "/v1/admin/template/" + encodeURIComponent(id) + "/trusted", { trusted: trust }),
        trust ? "Template trusted" : "Template no longer trusted", "Could not change the template: "));
  }
  else if (b.dataset.templateDelete) {
    const id = b.dataset.templateDelete;
    ask("Delete this template?", "Wallets can no longer register delegations with it. Registering the same document again restores it.", "Delete")
      .then((yes) => yes && act(api("/v1/admin/template/" + encodeURIComponent(id), { method: "DELETE" }), "Template deleted", "Could not delete the template: ").then((ok) => ok && go("templates")));
  }
  else if (b.dataset.artifactDelete) {
    const id = b.dataset.artifactDelete;
    ask("Delete this artifact?", "Templates registered later can no longer reference it. Registering the same document again restores it.", "Delete")
      .then((yes) => yes && act(api("/v1/admin/artifact/" + encodeURIComponent(id), { method: "DELETE" }), "Artifact deleted", "Could not delete the artifact: ").then((ok) => ok && go("artifacts")));
  }
});
document.addEventListener("submit", (e) => {
  if (!e.target.classList.contains("register")) return;
  e.preventDefault();
  const kind = e.submitter?.value === "artifact" ? "artifact" : "template", document_ = e.target.document.value.trim();
  if (!document_) return toast("Paste a document first", true);
  e.target.setAttribute("aria-busy", "true");
  send("POST", "/v1/" + kind, { document: document_ })
    .then((r) => { const id = (r.artifact || r.template).id; toast(`Registered ${kind} ${short(id, 8)}`); e.target.reset(); refresh(); go(`${kind}s/${id}`); }, (err) => toast(`Could not register the ${kind}: ${err.message}`, true))
    .finally(() => e.target.removeAttribute("aria-busy"));
});
document.addEventListener("keydown", (e) => {
  if ($("confirm").open || e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = e.target.matches("input, textarea"), catalog = page === "catalog";
  if (e.key === "/" && !typing) {
    e.preventDefault();
    if (page === "overview") go("delegations");
    $(catalog ? "csearch" : "search").focus();
  }
  else if (e.key === "Escape") typing ? e.target.blur() : go(selected ? "delegations" : csel ? ctab : "");
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !typing && page !== "overview") {
    const ids = catalog ? catalogRows().slice(0, MAX_ROWS).map((x) => `${ctab}/${x.id}`) : visibleRows().slice(0, MAX_ROWS).map((d) => "id/" + d.delegation.id);
    if (!ids.length) return;
    e.preventDefault();
    const i = ids.indexOf(catalog ? `${ctab}/${csel}` : selected), step = e.key === "ArrowDown" ? 1 : -1;
    go(ids[Math.min(ids.length - 1, Math.max(0, i < 0 ? 0 : i + step))]);
  }
});
$("search").addEventListener("input", renderList);
$("sort").addEventListener("change", renderList);
$("csearch").addEventListener("input", () => { cstate[ctab].q = $("csearch").value; renderCatalog(); });
$("csort").addEventListener("change", () => { cstate[ctab].sort = $("csort").value; renderCatalog(); });
// tooltips float above everything, kept inside the viewport
function showTip(e) {
  const t = e.target.closest?.("[data-tip]"), el = $("tooltip");
  if (!t) return;
  el.textContent = t.dataset.tip; el.hidden = false;
  const r = t.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + "px";
  el.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + "px";
}
const hideTip = (e) => e.target.closest?.("[data-tip]") && ($("tooltip").hidden = true);
document.addEventListener("mouseover", showTip); document.addEventListener("focusin", showTip);
document.addEventListener("mouseout", hideTip); document.addEventListener("focusout", hideTip);
addEventListener("scroll", () => ($("tooltip").hidden = true), true);
addEventListener("hashchange", () => { parseRoute(); render(); });

function refresh() { loadHealth(); return loadList().then(render); }
parseRoute(); render(); loadMeta(); refresh();
setInterval(() => { if (!document.hidden && !$("confirm").open) refresh(); }, 15000);
</script>
