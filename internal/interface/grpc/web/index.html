<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delegateed operator</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f4f5f7; --surface: #ffffff; --ink: #16181d; --muted: #5f636d; --faint: #989ba4; --line: #e3e5e9; --hover: #f5f6f8;
  --ok: #18794e; --ok-soft: #e3f4ea; --warn: #a35f00; --warn-soft: #fbefd6; --bad: #c4321f; --bad-soft: #fcebe8;
  --accent: #5b4bdb; --accent-soft: #e9e6fc;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0d0e11; --surface: #15161a; --ink: #ececf0; --muted: #9a9ca6; --faint: #686a73; --line: #26272d; --hover: #1c1d22;
    --ok: #4cc38a; --ok-soft: #12291d; --warn: #e9a83b; --warn-soft: #33270f; --bad: #f2735f; --bad-soft: #36160f;
    --accent: #a99bff; --accent-soft: #29254a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); }
h2 { margin: 0 0 .75rem; font-size: 1rem; font-weight: 600; line-height: 1.25; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: .86em; word-break: break-all; }
.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

button, select { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: .25rem .7rem; }
button:hover, select:hover { background: var(--hover); border-color: var(--faint); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 1.5rem; padding: 0 clamp(1rem, 3vw, 2rem); height: 3.25rem; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; }
nav { display: flex; align-self: stretch; gap: .25rem; }
nav a { display: flex; align-items: center; padding: 0 .75rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
nav a:hover { color: var(--ink); }
nav a[aria-current=page] { color: var(--ink); border-bottom-color: var(--accent); }
#pulse { margin-left: auto; font-size: .8rem; padding: .1rem .7rem; border-radius: 99px; background: var(--ok-soft); color: var(--ok); }
#pulse.down { background: var(--bad-soft); color: var(--bad); }
main { max-width: 72rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 3vw, 2rem) 3rem; }
#error { margin-bottom: 1rem; padding: .6rem .9rem; border-radius: 6px; background: var(--bad-soft); color: var(--bad); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .75rem 1rem; }
.card .label { color: var(--muted); font-size: .78rem; }
.card .value { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.card.alert .value { color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: baseline; }
th { color: var(--muted); font-size: .78rem; font-weight: 500; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--hover); }
.empty { color: var(--muted); padding: .5rem 0; }

.tag { display: inline-block; padding: 0 .45rem; border-radius: 4px; font-size: .74rem; background: var(--hover); color: var(--muted); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .75rem; }
.toolbar .spacer { flex: 1; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.25rem; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; }
dialog { width: min(60rem, 94vw); max-height: 88vh; padding: 1rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
dialog pre { margin: .75rem 0 0; padding: .75rem; max-height: 60vh; overflow: auto; background: var(--paper); border-radius: 6px; font: .85em/1.45 var(--mono); }
</style>
</head>
<body>
<header>
  <span class="brand">delegateed</span>
  <nav id="nav">
    <a href="#overview" data-view="overview">Overview</a>
    <a href="#delegations" data-view="delegations">Delegations</a>
    <a href="#templates" data-view="templates">Templates</a>
    <a href="#streams" data-view="streams">Streams</a>
  </nav>
  <span id="pulse">health</span>
</header>
<main>
  <div id="error" role="alert" hidden></div>
  <div id="view"></div>
</main>
<dialog id="doc"></dialog>

<script>
const $ = (selector) => document.querySelector(selector);
const view = $('#view');
let timer;

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sats = (value) => Number(value || 0).toLocaleString();
const when = (seconds) => (Number(seconds) ? new Date(Number(seconds) * 1000).toLocaleString() : '-');
const short = (text, n = 14) => (text.length > n * 2 + 1 ? `${text.slice(0, n)}…${text.slice(-n)}` : text);
const vars = (variables) => Object.entries(variables || {}).map(([k, v]) => `${esc(k)}=${esc(v)}`).join('<br>') || '-';
const tag = (text, kind = '') => (text ? `<span class="tag ${kind}">${esc(text)}</span>` : '');

function until(seconds) {
  if (!Number(seconds)) return '-';
  const delta = Number(seconds) - Date.now() / 1000;
  const magnitude = Math.abs(delta);
  const text = magnitude < 90 ? `${Math.round(magnitude)}s` : magnitude < 5400 ? `${Math.round(magnitude / 60)}m`
    : magnitude < 129600 ? `${Math.round(magnitude / 3600)}h` : `${Math.round(magnitude / 86400)}d`;
  return delta < 0 ? `${text} ago` : `in ${text}`;
}

const attemptKind = { succeeded: 'ok', failed: 'bad' };
const statusKind = { active: 'ok', cancelled: 'bad', expired: 'warn', done: 'accent' };
const copy = (text) => `<span class="mono">${esc(short(text || '', 12))}</span> ${text ? `<button class="link" data-copy="${esc(text)}">copy</button>` : ''}`;

async function api(path, options = {}) {
  const response = await fetch(`/v1/${path}`, {
    ...options, headers: { 'Content-Type': 'application/json' }, body: options.body && JSON.stringify(options.body),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || response.statusText);
  return body;
}

function fail(error) {
  $('#error').textContent = error.message;
  $('#error').hidden = false;
}

// openDoc shows a template or artifact document in the dialog
async function openDoc(kind, id) {
  try {
    const item = (await api(`${kind}/${encodeURIComponent(id)}`))[kind];
    let text = item.document || '';
    try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* show raw */ }
    const links = (item.artifactIds || []).map((a) => `<button class="link mono" data-viewartifact="${esc(a)}">${esc(short(a, 12))}</button>`).join(' ');
    $('#doc').innerHTML = `<div class="toolbar"><h2>${esc(kind)} <span class="mono">${esc(id)}</span></h2><span class="spacer"></span>
      <button id="doccopy">Copy</button><button id="docclose">Close</button></div>
      ${links ? `<div>Artifacts: ${links}</div>` : ''}<pre>${esc(text)}</pre>`;
    $('#doccopy').onclick = (event) => navigator.clipboard.writeText(text).then(() => { event.target.textContent = 'copied'; });
    $('#docclose').onclick = () => $('#doc').close();
    if (!$('#doc').open) $('#doc').showModal();
  } catch (error) {
    fail(error);
  }
}

// act runs a change and shows the view again
async function act(change) {
  try {
    await change();
    await show();
  } catch (error) {
    fail(error);
  }
}

function table(columns, rows, rowAttributes = () => '') {
  if (!rows.length) return '<p class="empty">Nothing here.</p>';
  const head = columns.map((c) => `<th class="${c.num ? 'num' : ''}">${esc(c.title)}</th>`).join('');
  const body = rows.map((row) => `<tr ${rowAttributes(row)}>${columns.map((c) => `<td class="${c.num ? 'num n' : ''}">${c.cell(row)}</td>`).join('')}</tr>`).join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function showHealth() {
  const health = await api('admin/health');
  const down = (health.entries || []).filter((e) => !e.healthy);
  const pulse = $('#pulse');
  pulse.className = down.length ? 'down' : '';
  pulse.textContent = down.length ? `down: ${down.map((e) => e.name).join(', ')}` : 'healthy';
  return health.entries || [];
}

const views = {
  async overview() {
    const [status, entries] = await Promise.all([api(`admin/status?horizonSeconds=${views.horizon}`), showHealth()]);
    const card = (label, value, alert) => `<div class="card ${alert ? 'alert' : ''}"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    view.innerHTML = `
      <div class="cards">
        ${card('Active delegations', sats(status.active))}
        ${card('Queued', sats(status.queued))}
        ${card('Registered', sats(status.registered))}
        ${card('Late', sats(status.late), Number(status.late) > 0)}
        ${card('Coins watched', sats(status.coins))}
        ${card('Amount watched (sats)', sats(status.amount))}
        ${card('Next due', esc(until(status.nextDue)))}
        ${card('Chain tip', sats(status.tipHeight))}
      </div>
      <div class="panel"><h2>Batch forecast</h2>
        <label>Horizon <select id="horizon">${[[86400, '24h'], [259200, '3d'], [604800, '7d']].map(([v, l]) => `<option value="${v}" ${v === views.horizon ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${table([
        { title: 'At', cell: (r) => `<details data-at="${esc(r.at)}" ${views.openBatches.has(String(r.at)) ? 'open' : ''}><summary>${esc(when(r.at))} <span class="muted">${esc(until(r.at))}</span></summary>${table([
          { title: 'Delegation', cell: (e) => `<button class="link" data-go="delegations/${esc(e.delegationId)}">${esc(e.delegationId)}</button>` },
          { title: 'Coins', num: true, cell: (e) => sats(e.coins) },
          { title: 'Amount (sats)', num: true, cell: (e) => sats(e.amount) },
          { title: 'Due', cell: (e) => `${esc(when(e.due))} <span class="muted">${esc(until(e.due))}</span>` },
          { title: 'Deadline', cell: (e) => `${esc(when(e.deadline))} <span class="muted">${esc(until(e.deadline))}</span>` },
        ], r.entries || [])}</details>` },
        { title: 'Intents', num: true, cell: (r) => sats(r.intents) },
        { title: 'Coins', num: true, cell: (r) => sats(r.coins) },
        { title: 'Amount (sats)', num: true, cell: (r) => sats(r.amount) },
      ], status.batches || [])}</div>
      <div class="panel"><h2>Health</h2>${table([
        { title: 'Dependency', cell: (e) => esc(e.name) },
        { title: 'State', cell: (e) => (e.healthy ? tag('ok', 'ok') : tag('down', 'bad')) },
        { title: 'Error', cell: (e) => `<span class="mono">${esc(e.error)}</span>` },
      ], entries)}</div>`;
    $('#horizon').onchange = (event) => { views.horizon = Number(event.target.value); views.overview(); };
    view.querySelectorAll('details[data-at]').forEach((d) => d.addEventListener('toggle', () => {
      views.openBatches[d.open ? 'add' : 'delete'](d.dataset.at);
    }));
  },
  horizon: 86400,
  openBatches: new Set(),

  async delegations(arg) {
    return arg ? this.detail(arg) : this.list();
  },

  async list() {
    const state = views.listState;
    state.rows = [];
    state.cursor = '';
    view.innerHTML = `
      <div class="toolbar">
        <label>Status
          <select id="filter">${['', 'active', 'cancelled', 'expired', 'done'].map((s) => `<option value="${s}" ${s === state.status ? 'selected' : ''}>${s || 'all'}</option>`).join('')}</select>
        </label>
        <span class="spacer"></span>
        <span class="muted">ordered by the earliest due coin, those without coins last</span>
      </div>
      <div class="panel" id="rows"></div>
      <div class="toolbar"><button id="more" hidden>Load more</button></div>`;
    $('#filter').onchange = (event) => { state.status = event.target.value; views.list(); };
    $('#more').onclick = () => fill();
    const rows = $('#rows');
    const fill = async () => {
      try {
        const query = new URLSearchParams({ status: state.status, cursor: state.cursor, limit: 50 });
        const page = await api(`admin/delegations?${query}`);
        state.rows = state.rows.concat(page.delegations || []);
        state.cursor = page.nextCursor || '';
        rows.innerHTML = table([
          { title: 'ID', cell: (s) => s.delegation.id },
          { title: 'Address', cell: (s) => `<span class="mono">${esc(short(s.delegation.address || '', 10))}</span>` },
          { title: 'Origin', cell: (s) => Number(s.delegation.streamId) ? tag('stream', 'accent') : tag('client', '') },
          { title: 'Status', cell: (s) => tag(s.delegation.status, statusKind[s.delegation.status]) },
          { title: 'Coins', num: true, cell: (s) => sats(s.coins) },
          { title: 'Amount (sats)', num: true, cell: (s) => sats(s.amount) },
          { title: 'Next due', cell: (s) => esc(Number(s.coins) ? until(s.nextDue) : '-') },
          { title: 'Last attempt', cell: (s) => tag(s.lastAttempt, attemptKind[s.lastAttempt]) },
        ], state.rows, (s) => `class="row" data-go="delegations/${s.delegation.id}"`);
        $('#more').hidden = !state.cursor;
      } catch (error) {
        fail(error);
      }
    };
    await fill();
  },
  listState: { status: '', rows: [], cursor: '' },

  async detail(id) {
    const [detail, { attempts = [], nextCursor = '' }] = await Promise.all([
      api(`delegation?id=${encodeURIComponent(id)}`), api(`admin/delegation/${encodeURIComponent(id)}/attempts?limit=100`),
    ]);
    const d = detail.delegation;
    const actions = d.status === 'active' ? `<button class="danger" data-cancel="${d.id}">Cancel</button>`
      : d.status === 'cancelled' ? `<button data-resume="${d.id}">Resume</button>` : '';
    view.innerHTML = `
      <div class="toolbar"><button class="link" data-go="delegations">&larr; Delegations</button><span class="spacer"></span>${actions}</div>
      <div class="panel"><h2>Delegation ${esc(d.id)} ${tag(d.status, statusKind[d.status])}</h2><dl>
        <dt>Address</dt><dd class="mono">${esc(d.address)}</dd>
        <dt>Fingerprint</dt><dd class="mono">${esc(d.fingerprint)}</dd>
        <dt>Template</dt><dd class="mono">${esc(d.templateId)}</dd>
        <dt>Origin</dt><dd>${Number(d.streamId) ? `stream ${esc(d.streamId)}` : 'client'}</dd>
        <dt>Expires</dt><dd>${esc(when(d.expiresAt))}</dd>
        <dt>Created</dt><dd>${esc(when(d.createdAt))}</dd>
        <dt>Variables</dt><dd class="mono">${vars(d.variables)}</dd>
      </dl></div>
      <div class="panel"><h2>Coins</h2>${table([
        { title: 'Outpoint', cell: (c) => copy(c.outpoint) },
        { title: 'Status', cell: (c) => tag(c.status, c.status === 'present' ? 'ok' : '') },
        { title: 'Amount (sats)', num: true, cell: (c) => sats(c.amount) },
        { title: 'Due', cell: (c) => esc(when(c.due)) },
        { title: 'Expires', cell: (c) => esc(when(c.expiresAt)) },
        { title: 'Spent by', cell: (c) => copy(c.spentBy) },
      ], detail.coins || [])}</div>
      <div class="panel"><h2>Attempts (newest first${nextCursor ? ', first 100' : ''})</h2>${table([
        { title: 'ID', cell: (a) => a.id },
        { title: 'Status', cell: (a) => tag(a.status, attemptKind[a.status] || 'warn') },
        { title: 'Txid', cell: (a) => copy(a.txid) },
        { title: 'Coins', cell: (a) => (a.coins || []).map((o) => `<span class="mono">${esc(short(o, 8))}</span>`).join('<br>') || '-' },
        { title: 'Error', cell: (a) => `<span class="mono">${esc(a.error)}</span>` },
        { title: 'Updated', cell: (a) => esc(when(a.updatedAt)) },
      ], attempts)}</div>`;
  },

  async templates() {
    const [{ templates = [] }, { artifacts = [] }] = await Promise.all([api('templates'), api('admin/artifacts')]);
    view.innerHTML = `<div class="panel"><h2>Templates</h2>${table([
      { title: 'ID', cell: (t) => copy(t.id) },
      { title: 'Type', cell: (t) => esc(t.type) },
      { title: 'Status', cell: (t) => tag(t.status, t.status === 'active' ? 'ok' : 'bad') },
      { title: 'Artifacts', num: true, cell: (t) => (t.artifactIds || []).length },
      { title: 'Created', cell: (t) => esc(when(t.createdAt)) },
      { title: '', cell: (t) => `
        <button data-viewtemplate="${esc(t.id)}">View</button>
        <button data-template="${esc(t.id)}" data-status="${t.status === 'active' ? 'disabled' : 'active'}">${t.status === 'active' ? 'Disable' : 'Enable'}</button>
        <button class="danger" data-deltemplate="${esc(t.id)}">Delete</button>` },
    ], templates)}</div>
    <div class="panel"><h2>Artifacts</h2>${table([
      { title: 'ID', cell: (a) => copy(a.id) },
      { title: 'Created', cell: (a) => esc(when(a.createdAt)) },
      { title: '', cell: (a) => `<button data-viewartifact="${esc(a.id)}">View</button> <button class="danger" data-delartifact="${esc(a.id)}">Delete</button>` },
    ], artifacts)}</div>`;
  },

  async streams() {
    const { streams = [] } = await api('admin/streams');
    const { templates = [] } = await api('templates');
    view.innerHTML = `<div class="panel"><h2>Register a stream</h2>
      <form id="reg" class="toolbar">
        <select name="t">${templates.filter((t) => t.status === 'active').map((t) => `<option value="${esc(t.id)}">${esc(short(t.id, 10))} (${esc(t.type)})</option>`).join('')}</select>
        <textarea name="v" rows="2" cols="50" placeholder="variables, one name=hex per line"></textarea>
        <button>Register</button>
      </form></div>
      <div class="panel"><h2>Streams</h2>${table([
      { title: 'ID', cell: (s) => s.id },
      { title: 'Template', cell: (s) => copy(s.templateId) },
      { title: 'Variables', cell: (s) => `<span class="mono">${vars(s.variables)}</span>` },
      { title: 'Status', cell: (s) => tag(s.status, s.status === 'active' ? 'ok' : 'bad') },
      { title: 'Created', cell: (s) => esc(when(s.createdAt)) },
      { title: '', cell: (s) => (s.status === 'active' ? `<button class="danger" data-stream="${s.id}">Cancel</button>` : '') },
    ], streams)}</div>`;
    $('#reg').onsubmit = (event) => {
      event.preventDefault();
      const f = event.target;
      const variables = Object.fromEntries(f.v.value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => l.split('=').map((x) => x.trim())));
      act(() => api('admin/stream', { method: 'POST', body: { templateId: f.t.value, variables } }));
    };
  },
};

async function show() {
  clearTimeout(timer);
  $('#error').hidden = true;
  const [name, arg] = (location.hash.slice(1) || 'overview').split('/');
  const current = views[name] ? name : 'overview';
  document.querySelectorAll('#nav a').forEach((a) => (a.dataset.view === current ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  try {
    await views[current](arg);
    if (current === 'overview') timer = setTimeout(show, 5000);
    else await showHealth();
  } catch (error) {
    fail(error);
  }
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-go], [data-cancel], [data-resume], [data-template], [data-stream], [data-copy], [data-deltemplate], [data-delartifact], [data-viewtemplate], [data-viewartifact]');
  if (!el) return;
  const { go, cancel, resume, template, status, stream, deltemplate, delartifact } = el.dataset;
  if (el.dataset.viewtemplate) openDoc('template', el.dataset.viewtemplate);
  else if (el.dataset.viewartifact) openDoc('artifact', el.dataset.viewartifact);
  else if (el.dataset.copy) navigator.clipboard.writeText(el.dataset.copy).then(() => { el.textContent = 'copied'; });
  else if (deltemplate && confirm(`Delete template ${deltemplate}?`)) act(() => api(`admin/template/${deltemplate}`, { method: 'DELETE' }));
  else if (delartifact && confirm(`Delete artifact ${delartifact}?`)) act(() => api(`admin/artifact/${delartifact}`, { method: 'DELETE' }));
  else if (go) location.hash = go;
  else if (cancel && confirm(`Cancel delegation ${cancel}?`)) act(() => api(`admin/delegation/${cancel}/cancel`, { method: 'POST', body: {} }));
  else if (resume) act(() => api(`admin/delegation/${resume}/resume`, { method: 'POST', body: {} }));
  else if (template && status) act(() => api(`admin/template/${template}`, { method: 'POST', body: { status } }));
  else if (stream && confirm(`Cancel stream ${stream}?`)) act(() => api(`admin/stream/${stream}/cancel`, { method: 'POST', body: {} }));
});

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
