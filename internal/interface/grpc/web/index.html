<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delegateed operator</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f6f6f4; --surface: #ffffff; --ink: #17181c; --muted: #63656e; --faint: #9a9ca5; --line: #e6e6e3; --hover: #f3f3f1; --current: #efedfd;
  --ok: #18794e; --ok-soft: #e3f4ea; --window: #a35f00; --window-a: #fbefd6; --window-b: #f2d9a0; --bad: #c4321f; --bad-soft: #fcebe8;
  --track: #ececea; --elapsed: rgba(23, 24, 28, .22); --accent: #5b4bdb; --accent-ink: #ffffff; --shadow: 0 16px 40px rgba(23, 24, 28, .16);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0c0c0e; --surface: #141417; --ink: #ececf0; --muted: #9b9ca5; --faint: #66676f; --line: #25252a; --hover: #1b1b1f; --current: #221f38;
    --ok: #4cc38a; --ok-soft: #12291d; --window: #e9a83b; --window-a: #33270f; --window-b: #4d3b14; --bad: #f2735f; --bad-soft: #36160f;
    --track: #222226; --elapsed: rgba(236, 236, 240, .22); --accent: #a99bff; --accent-ink: #0c0c0e; --shadow: 0 16px 40px rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hash { font-family: var(--mono); font-size: .86em; word-break: break-all; }
.n { font-variant-numeric: tabular-nums; }
kbd { font: .8em var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3rem; background: var(--surface); }
[hidden] { display: none !important; }

/* buttons */
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 0 .85rem; min-height: 2rem; font-weight: 500; font-size: .88rem; transition: background .12s, border-color .12s, color .12s; }
button:hover { background: var(--hover); border-color: var(--faint); }
button:active { background: var(--current); }
button:disabled { cursor: default; opacity: .55; }
button:disabled:hover { background: var(--surface); border-color: var(--line); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.danger { color: var(--bad); }
button.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
button.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
button.danger.solid:hover { filter: brightness(1.08); background: var(--bad); }
button.link { border: 0; background: none; padding: 0; min-height: 0; font-weight: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: .15em; border-radius: 2px; }
button.link:hover { background: none; color: var(--ink); }
/* hashes read as data: ink, underlined on hover only */
button.link.hash, .horizon button, a.hash { color: var(--ink); text-decoration: none; }
button.link.hash:hover, .horizon button:hover, a.hash:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .2em; }
button.mini { min-height: 0; padding: 0 .45rem; margin-left: .5rem; font: 500 .74rem/1.6 var(--sans); color: var(--muted); border-radius: 4px; vertical-align: .1em; }
button.mini:hover { color: var(--ink); }
button[aria-busy=true] { pointer-events: none; opacity: .7; }
button[aria-busy=true]::after { content: "…"; }

/* header */
header { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: center; padding: .6rem clamp(1rem, 3vw, 2rem); background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { font-size: 1rem; letter-spacing: -.01em; display: flex; align-items: center; gap: .5rem; }
header h1::before { content: ""; width: .7rem; height: .7rem; border-radius: 3px; background: var(--accent); }
header h1 button { all: unset; cursor: pointer; border-radius: 2px; }
header h1 button:hover { color: var(--accent); }
header .meta { color: var(--muted); font-size: .86rem; display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
header .meta button { all: unset; cursor: pointer; color: var(--ink); font: .82rem var(--mono); text-decoration: underline dotted; text-underline-offset: .2em; border-radius: 2px; }
header .meta button:hover { color: var(--accent); }
#health { margin-left: auto; font-size: .86rem; color: var(--muted); display: flex; align-items: center; gap: .45rem; }
#health i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--faint); flex: none; }
#health.ok i { background: var(--ok); } #health.down i { background: var(--bad); }
#health.down { color: var(--bad); }

/* status */
#status { display: flex; flex-wrap: wrap; gap: .25rem 2.25rem; padding: .5rem clamp(1rem, 3vw, 2rem); background: var(--paper); border-bottom: 1px solid var(--line); font-size: .84rem; color: var(--muted); min-height: 2.5rem; align-items: center; }
#status b { color: var(--ink); font-weight: 600; }
#status .warn, #status .warn b { color: var(--bad); }
#status .busy, #status .busy b { color: var(--window); }
.pulse { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--window); margin-right: .4rem; vertical-align: middle; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

main { display: grid; grid-template-columns: minmax(20rem, 27rem) minmax(0, 1fr); min-height: calc(100vh - 6rem); }
#list { border-right: 1px solid var(--line); background: var(--surface); min-width: 0; }
#list .pane { display: flex; flex-direction: column; height: calc(100vh - 5.25rem); position: sticky; top: 0; }
.filters { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.filters button { flex: 1; border: 0; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: .65rem .5rem; min-height: 0; color: var(--muted); font-size: .86rem; font-weight: 500; background: none; white-space: nowrap; }
.filters button:hover { background: var(--hover); color: var(--ink); }
.filters button[aria-pressed=true] { color: var(--ink); border-bottom-color: var(--accent); }
.filters .n { color: var(--faint); margin-left: .15rem; }
.filters .alert .n { color: var(--bad); font-weight: 600; }
.filters button[aria-pressed=true] .n { color: var(--muted); }
.listbar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 0 .75rem .6rem; }
.kinds { display: flex; gap: .35rem; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.kinds::-webkit-scrollbar { display: none; }
.kinds.more { mask-image: linear-gradient(to right, #000 82%, transparent); }
.kinds button { flex: none; }
.sort { position: relative; flex: none; color: var(--muted); }
.sort:hover { color: var(--ink); }
.sort select { appearance: none; -webkit-appearance: none; border: 0; background: none; color: inherit; font: 500 .76rem var(--sans); padding: .25rem 1.15rem .25rem .4rem; border-radius: var(--r); cursor: pointer; }
.sort select:hover { background: var(--hover); }
.sort::after { content: ""; position: absolute; right: .45rem; top: 50%; width: .32rem; height: .32rem; margin-top: -.24rem; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.kinds button { min-height: 0; padding: .15rem .6rem; border: 1px solid var(--line); border-radius: 99px; background: none; color: var(--muted); font-size: .76rem; font-weight: 500; }
.kinds button[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--current); }
.kinds .n { color: var(--faint); margin-left: .2rem; }
#rows .amt { font-variant-numeric: tabular-nums; font-size: .86rem; font-weight: 600; white-space: nowrap; }
#rows .count { color: var(--faint); font-size: .76rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
#rows .kind { color: var(--faint); }
#search { display: block; width: calc(100% - 1.5rem); margin: .65rem .75rem .55rem; padding: .5rem .7rem; min-height: 2.25rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
#search:focus, #register textarea:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
#rows { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
#list .pane > :not(#rows) { flex-shrink: 0; }
#rows li button { display: grid; grid-template-columns: .6rem minmax(0, 1fr) auto; gap: .2rem .7rem; align-items: baseline; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: .75rem 1rem .75rem 1rem; min-height: 0; font-weight: 400; background: none; box-shadow: inset 3px 0 0 transparent; }
#rows li button:hover { background: var(--hover); }
#rows li button[aria-current=true] { background: var(--current); box-shadow: inset 3px 0 0 var(--accent); }
#rows li button:focus-visible { outline-offset: -2px; }
.dot { width: .5rem; height: .5rem; border-radius: 50%; align-self: center; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.bad, .dot.late { background: var(--bad); } .dot.renewing { background: var(--window); } .dot.off { background: none; border: 1px solid var(--faint); }
#rows .sub { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rows .sub.bad, #rows .sub.late { color: var(--bad); } #rows .sub.renewing { color: var(--window); }
.empty { padding: 1.25rem 1rem; color: var(--muted); max-width: 36rem; line-height: 1.55; }
#hint { display: flex; justify-content: space-between; gap: .5rem; padding: .45rem .9rem; border-top: 1px solid var(--line); color: var(--faint); font-size: .78rem; }

/* skeletons */
.sk { display: block; height: .8em; border-radius: 3px; background: var(--track); animation: sk 1.2s ease-in-out infinite; }
@keyframes sk { 50% { opacity: .45; } }
#rows li.sk-row { display: grid; grid-template-columns: .6rem 1fr auto; gap: .35rem .6rem; align-items: center; padding: .8rem .75rem .8rem .9rem; border-bottom: 1px solid var(--line); }
#rows li.sk-row .sk:first-child { width: .55rem; height: .55rem; border-radius: 50%; }
#rows li.sk-row .sk:last-child { width: 4rem; }
#rows li.sk-row .sk:nth-child(4) { grid-column: 2 / 4; width: 60%; }
#detail[aria-busy=true] { opacity: .85; }
.sk-detail .sk { margin: .6rem 0; }
@media (prefers-reduced-motion: reduce) { .pulse, .sk { animation: none; } button { transition: none; } }

/* detail */
#detail { padding: 2rem clamp(1rem, 3.5vw, 3rem) 5rem; min-width: 0; max-width: 76rem; }
#detail h2 { font-size: 1.45rem; letter-spacing: -.025em; display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; }
#detail h3 { font-size: .98rem; margin: 3rem 0 .4rem; padding-top: 1.5rem; border-top: 1px solid var(--line); letter-spacing: -.01em; }
#detail h3:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
#detail h3 + p { margin: 0 0 1.1rem; color: var(--muted); max-width: 42rem; font-size: .86rem; }
#detail .empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 1.25rem; }
.title { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: flex-start; justify-content: space-between; }
.title .hash { margin-top: .3rem; font-size: .9rem; max-width: 46rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, max-content)); gap: .75rem 3rem; margin: 1.5rem 0 0; padding: 1rem 0; border-top: 1px solid var(--line); }
.facts div { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.facts dt { color: var(--muted); font-size: .76rem; }
.facts dd { margin: 0; font-weight: 600; font-size: .98rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .45rem; }
.facts dd .mini { margin-left: 0; flex: none; }
.facts dd .hash { word-break: normal; }
.badge { display: inline-flex; align-items: center; gap: .4rem; border-radius: 99px; padding: .1rem .65rem .1rem .5rem; font-size: .78rem; font-weight: 500; border: 1px solid var(--line); color: var(--muted); }
.badge::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--faint); }
.badge.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; } .badge.ok::before { background: var(--ok); }
.badge.bad, .badge.late { color: var(--bad); background: var(--bad-soft); border-color: transparent; } .badge.bad::before, .badge.late::before { background: var(--bad); }
.badge.renewing { color: var(--window); background: var(--window-a); border-color: transparent; } .badge.renewing::before { background: var(--window); }
.note { border-left: 3px solid var(--bad); padding: .6rem .9rem; margin: 1rem 0 0; background: var(--bad-soft); border-radius: 0 var(--r) var(--r) 0; max-width: 46rem; }
.paths { list-style: none; margin: 0; padding: 0; max-width: 46rem; }
.paths li { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--line); } .paths li:last-child { border-bottom: 0; }
.paths .words { font-family: var(--mono); font-size: .86em; }

/* lifetime bar: birth to expiry, renewal window hatched */
.vtxo { padding: .9rem 0; } .vtxo + .vtxo { border-top: 1px solid var(--line); }
.vtxo .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .25rem 1rem; }
.vtxo .amount { font-weight: 600; }
.life { position: relative; height: .55rem; margin: .65rem 0 .45rem; background: var(--track); border-radius: 99px; }
.life .elapsed { position: absolute; inset: 0 auto 0 0; background: var(--elapsed); z-index: 1; border-radius: 4px 0 0 4px; }
.life .window { position: absolute; inset: 0 0 0 auto; background: repeating-linear-gradient(135deg, var(--window-a) 0 5px, var(--window-b) 5px 10px); border-left: 2px solid var(--window); border-radius: 0 4px 4px 0; }
.life .now { position: absolute; z-index: 2; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.life .reserve, .horizon .lane .reserve, .legend i.r { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 4px, var(--track) 4px 8px); border-left: 2px solid var(--bad); }
.life .reserve { position: absolute; inset: 0 0 0 auto; z-index: 1; border-radius: 0 4px 4px 0; }
.life .batch, .horizon .lane .batch, .legend i.b { position: absolute; z-index: 3; top: 50%; width: .7rem; height: .7rem; margin: -.35rem 0 0 -.35rem; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-sizing: border-box; }
.legend i.b { position: static; display: inline-block; margin: 0 .35rem 0 .2rem; vertical-align: middle; }
.state { font-size: .82rem; color: var(--muted); }
.state.in, .state.renewing { color: var(--window); font-weight: 600; } .state.late { color: var(--bad); font-weight: 600; }

/* overview: every address on one time axis */
.horizon { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr) auto; gap: .5rem 1rem; align-items: center; font-size: .86rem; }
.horizon button { all: unset; font: .86em var(--mono); cursor: pointer; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 2px; }
.horizon button:focus-visible { outline: 2px solid var(--accent); }
.horizon .lane { position: relative; display: flex; height: .55rem; background: var(--track); border-radius: 99px; }
.horizon .lane .left, .horizon .lane .window, .horizon .lane .reserve { height: 100%; }
.horizon .lane .left { border-radius: 99px 0 0 99px; } .horizon .lane .reserve { border-radius: 0 99px 99px 0; }
.horizon .lane .left { background: var(--elapsed); }
.horizon .lane .window { background: repeating-linear-gradient(135deg, var(--window-a) 0 5px, var(--window-b) 5px 10px); border-left: 2px solid var(--window); }
.horizon .lane.late { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.horizon .lane .window, .life .window, .horizon .lane .reserve, .life .reserve { min-width: 3px; }
.horizon .axis { position: relative; height: 1.4rem; border-top: 1px solid var(--line); margin-top: .1rem; font-size: .74rem; color: var(--faint); }
.horizon .axis i { position: absolute; top: 0; padding: .2rem 0 0 .3rem; border-left: 1px solid var(--line); font-style: normal; white-space: nowrap; }
.horizon .t { color: var(--muted); white-space: nowrap; text-align: right; }
.horizon .t.in, .horizon .t.renewing { color: var(--window); font-weight: 600; } .horizon .t.late { color: var(--bad); font-weight: 600; }
.plan td.n { white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.25rem; margin: .75rem 0 0; color: var(--muted); font-size: .8rem; }
.legend i { display: inline-block; width: 1.1rem; height: .55rem; border-radius: 2px; vertical-align: middle; margin-right: .35rem; background: var(--elapsed); }
.legend i.w { background: repeating-linear-gradient(135deg, var(--window-a) 0 5px, var(--window-b) 5px 10px); border-left: 2px solid var(--window); }

.doc { max-width: 60rem; margin-top: .75rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.doc .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .35rem .5rem .35rem .75rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
.doc pre { margin: 0; padding: .75rem; overflow: auto; max-height: 36rem; font: .82rem/1.55 var(--mono); tab-size: 2; }
.j-k { color: var(--accent); } .j-s { color: var(--ok); } .j-n { color: var(--window); } .j-b { color: var(--bad); } .j-p { color: var(--faint); }
#register textarea { display: block; width: 100%; max-width: 46rem; min-height: 10rem; margin-bottom: .75rem; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); color: var(--ink); font: .84rem/1.5 var(--mono); resize: vertical; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: .76rem; padding: .4rem .75rem .5rem 0; border-bottom: 1px solid var(--line); }
td { padding: .6rem .75rem .6rem 0; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--hover); }
td:first-child, td.hash { white-space: nowrap; word-break: normal; }
td.res { white-space: nowrap; font-weight: 500; } td.res.ok { color: var(--ok); } td.res.bad { color: var(--bad); }
.scroll { overflow-x: auto; }

dialog { border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem 1.5rem 1.5rem; width: min(30rem, calc(100vw - 2rem)); color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(12, 12, 14, .55); backdrop-filter: blur(2px); }
dialog h2 { font-size: 1.05rem; }
dialog p { margin: .6rem 0 1.5rem; color: var(--muted); }
dialog .actions { justify-content: flex-end; }
#toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .55rem 1rem; border-radius: var(--r); font-size: .88rem; z-index: 10; box-shadow: var(--shadow); max-width: calc(100vw - 2rem); }
#toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 800px) {
  main { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  #health { margin-left: 0; }
  #status > span { border-right: 0; margin-right: 0; padding-right: 0; width: 100%; }
  #list { border-right: 0; border-bottom: 1px solid var(--line); }
  #list .pane { position: static; height: auto; max-height: 45vh; }
  #rows li button { padding-top: .75rem; padding-bottom: .75rem; }
  #hint { display: none; }
  .facts { grid-template-columns: 1fr 1fr; gap: .75rem 1.5rem; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
  .horizon { grid-template-columns: minmax(5.5rem, 7.5rem) minmax(0, 1fr); gap: .2rem .75rem; }
  .horizon .t { grid-column: 2; text-align: left; white-space: normal; font-size: .76rem; margin-bottom: .45rem; }
}
</style>
</head>
<body>
<header>
  <h1><button id="home" title="Overview">delegateed</button></h1>
  <div class="meta" id="meta"></div>
  <div id="health" role="status"><i></i><span>checking…</span></div>
</header>
<div id="status" role="status"><span><i class="sk" style="width:12rem"></i></span></div>
<main>
  <section id="list" aria-label="Delegations"><div class="pane">
    <div class="filters" id="filters"></div>
    <input id="search" type="search" placeholder="Address, #id, key or outpoint" aria-label="Find a delegation">
    <div class="listbar">
      <div class="kinds" id="kinds"></div>
      <label class="sort"><select id="sort" aria-label="Sort the list"><option value="urgency">Urgent</option><option value="amount">Largest</option><option value="newest">Newest</option></select></label>
    </div>
    <ul id="rows"><li class="sk-row"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></li><li class="sk-row"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></li><li class="sk-row"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></li></ul>
    <div id="hint"><span id="shown"></span><span><kbd>↑</kbd> <kbd>↓</kbd> move, <kbd>/</kbd> find, <kbd>Esc</kbd> overview</span></div>
  </div></section>
  <section id="detail" aria-live="polite" aria-busy="true"></section>
</main>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <div class="actions"><button value="no"></button><button class="danger solid" id="confirm-yes"></button></div>
</dialog>
<div id="toast" role="status" hidden></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = (s, n = 10) => (s.length > 2 * n + 1 ? s.slice(0, n) + "…" + s.slice(-n) : s);
const num = (v) => Number(v || 0); // the gateway encodes int64 as strings
const sats = (v) => num(v).toLocaleString() + " sats";
const nowSecs = () => Date.now() / 1000;
const charges = (program) => Boolean(program) && Number(program) !== 0; // "0.0" is a fee program too
const skeleton = (n) => `<div class="sk-detail" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="sk" style="width:${[55, 90, 40, 70, 30][i % 5]}%"></i>`).join("")}</div>`;

const EXPLORERS = { bitcoin: "https://arkade.space", mutinynet: "https://explorer.mutinynet.arkade.sh" };
const explorer = () => EXPLORERS[info?.network];
// explore links a txid, an outpoint or an Ark address to the network's explorer, else shows it as is
function explore(value, label = value) {
  if (!explorer() || !value) return esc(label);
  const path = /^t?ark1/.test(value) ? "address/" + value : "tx/" + value.split(":")[0];
  return `<a class="hash" href="${esc(explorer() + "/" + path)}" target="_blank" rel="noopener" title="Open in the explorer">${esc(label)}</a>`;
}
let delegations = [], status = null, filter = null, selected = location.hash.slice(1), detail = null, allVtxos = false, info = null;
let templates = [], artifacts = [];
let loadLimit = 5000, moreRows = false; // newest first, a page of 1000 at a time

const OPS = { 0x75: "DROP", 0x87: "EQUAL", 0x88: "EQUALVERIFY", 0xa8: "SHA256", 0xa9: "HASH160", 0xac: "CHECKSIG", 0xad: "CHECKSIGVERIFY",
  0xae: "CHECKMULTISIG", 0xb1: "CHECKLOCKTIMEVERIFY", 0xb2: "CHECKSEQUENCEVERIFY", 0xba: "CHECKSIGADD" };
// a key that is none of these is a tweaked covenant key, named by its own bytes
function keyName(x) {
  const known = [...(info ? [["server", info.serverPubkey], ["emulator", info.emulatorPubkey], ["delegatee", info.delegatePubkey]] : []),
    ...Object.entries(detail?.delegation.variables || {})];
  return known.find(([, k]) => k && (k.length === 64 || k.length === 66) && k.slice(-64) === x)?.[0] ?? "covenant·" + x.slice(0, 6);
}
const bytes = (hex) => Uint8Array.from(hex.match(/../g) ?? [], (h) => parseInt(h, 16));
// minimal little-endian, the top bit of the last byte is the sign
function scriptNum(b) {
  if (!b.length) return 0;
  const v = b.reduceRight((a, x, i) => a * 256 + (i === b.length - 1 ? x & 0x7f : x), 0);
  return b[b.length - 1] & 0x80 ? -v : v;
}
const bip68 = (v) => (v & (1 << 22) ? span((v & 0xffff) * 512) : (v & 0xffff) + " blocks");
function variable(name, type, hex) {
  if (type !== "int") return `<span class="hash" title="${esc(hex)}">${esc(short(hex, 10))}</span>${hex.length > 21 ? `<button class="mini" data-copy="${esc(hex)}" title="Copy ${esc(name)}">copy</button>` : ""}`;
  const n = scriptNum(bytes(hex));
  const text = /delay/.test(name) ? bip68(n) : /window/.test(name) ? span(n) : /fee/.test(name) ? sats(n) : n.toLocaleString();
  return `<span class="n" title="script number 0x${esc(hex) || "(empty)"}">${esc(text)}</span>`;
}
function scriptWords(hex) {
  const b = bytes(hex), out = [];
  for (let i = 0; i < b.length;) {
    const op = b[i++];
    let n = op > 0 && op <= 0x4b ? op : op === 0x4c ? b[i++] : op === 0x4d ? b[i] | (b[i + 1] << 8) : -1;
    if (op === 0x4d) i += 2;
    if (n < 0) { out.push(op === 0 ? "0" : op >= 0x51 && op <= 0x60 ? String(op - 0x50) : OPS[op] ?? "OP_" + op.toString(16)); continue; }
    const data = Array.from(b.slice(i, i + n), (x) => x.toString(16).padStart(2, "0")).join(""); i += n;
    if (n === 32) { out.push(keyName(data)); continue; }
    const next = b[i], v = scriptNum(b.slice(i - n, i));
    if (next === 0xb2) out.push("after " + bip68(v));
    else if (next === 0xb1) out.push(v < 500_000_000 ? "from block " + v.toLocaleString() : "from " + new Date(v * 1000).toLocaleDateString());
    else out.push(n <= 8 ? String(v) : short(data, 6));
  }
  return out.join(" ");
}

// a watch boards an onchain coin, the rest renew VTXOs
const boards = (delegation) => (delegation.slots || []).some((s) => s.onchain);
// a spend binds coins until it expires, as RegisterSpend does
const spends = (delegation) => !delegation.address && num(delegation.expiresAt) > 0;
const WATCH = { coins: "VTXOs at this address", stop: "Stop renewing", resume: "Resume renewing" };
const KINDS = {
  spend: { done: "spent", doing: "spending", attempts: "Spend attempts", coins: "Coins it spends", stop: "Cancel spend", resume: "Resume spend",
    noAttempt: "No attempt yet. A spend runs at the next scan.", noCoin: "No coin left: the spend ran, or something else spent its coins." },
  boarding: { ...WATCH, done: "boarded", doing: "active", attempts: "Boarding attempts",
    noAttempt: "No attempt yet. A deposit is boarded once it confirms.", noCoin: "Nothing to board: no deposit sits at this address right now." },
  renewal: { ...WATCH, done: "renewed", doing: "renewing", attempts: "Renewal attempts",
    noAttempt: "No attempt yet. A VTXO is first renewed when it enters its renewal window.", noCoin: "Nothing to renew: no spendable VTXO sits at this address right now." },
};
const kindKey = (delegation) => (spends(delegation) ? "spend" : boards(delegation) ? "boarding" : "renewal");
const kindOf = (delegation) => KINDS[kindKey(delegation)];
function stateOf(d) {
  const r = d.lastRenewal, done = kindOf(d.delegation).done;
  if (d.delegation.status !== "active") return { key: "off", dot: "off", text: d.delegation.status === "cancelled" ? "stopped" : d.delegation.status === "done" ? done : d.delegation.status };
  if (d.unmanagedReason)
    return { key: "bad", dot: "bad", skipped: true, text: d.unmanagedReason, why: "The scanner skips it: " + d.unmanagedReason + "." };
  if (d.renewing) return { key: "ok", dot: "renewing", text: "in a batch now", why: "A batch session holds its coins; the result shows up when it ends." };
  if (r && !r.success) return { key: "bad", dot: "bad", text: "failed " + ago(r.attemptedAt), why: r.error };
  // overdue: its planned batch time passed and it is still here
  const left = num(d.nextExpiry) - nowSecs(), at = num(d.nextBatchAt), overdue = at ? nowSecs() - at : 0;
  if (num(d.nextExpiry) && left <= 0)
    return { key: "late", dot: "late", text: "expired " + ago(d.nextExpiry), why: "A VTXO expired without being renewed." };
  if (overdue > 0)
    return { key: "late", dot: "late", text: "overdue by " + span(overdue), why: "Past its deadline and not renewed: check that arkd rounds are running." };
  if (!r) return { key: "ok", dot: "", text: "not " + done + " yet" };
  return { key: "ok", dot: "ok", text: done + " " + ago(r.attemptedAt) };
}
const MAX_ROWS = 300; // the first ones in the chosen order
const MAX_LANES = 20, MAX_VTXOS = 40, AXIS_UNIT = 600; // ten minutes: the horizon's finest step
const URGENCY = { bad: 0, late: 1, ok: 2, off: 3 };
const FILTERS = [
  ["attention", "Attention", (d) => ["bad", "late"].includes(stateOf(d).key)],
  ["active", "Active", (d) => d.delegation.status === "active"],
  ["cancelled", "Ended", (d) => d.delegation.status !== "active"],
  ["all", "All", () => true],
];

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || res.statusText);
  return body;
}
const send = (method, path, body) => api(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const act = (request, done, failed) => request.then(() => { toast(done); refresh(); }, (e) => toast(failed + e.message, true));
const shown = {}; // kind: { id, document }, kept across refreshes
const showDocument = (kind, id) => api(`/v1/${kind}/` + encodeURIComponent(id))
  .then((r) => { shown[kind] = { id, document: r[kind].document }; renderOverview(); $(kind + "-doc")?.scrollIntoView({ block: "nearest" }); },
    (e) => toast(`Could not load the ${kind}: ` + e.message, true));

// ponytail: JSON.parse rounds numbers past 2^53, copy gives the exact document
function jsonHtml(v, pad = "") {
  const p = (c) => `<span class="j-p">${c}</span>`, inner = pad + "  ";
  if (v === null || typeof v !== "object") return `<span class="${typeof v === "string" ? "j-s" : typeof v === "number" ? "j-n" : "j-b"}">${esc(JSON.stringify(v))}</span>`;
  const entries = Object.entries(v), [open, close] = Array.isArray(v) ? "[]" : "{}";
  if (!entries.length) return p(open + close);
  const item = ([k, x]) => (Array.isArray(v) ? "" : `<span class="j-k">${esc(JSON.stringify(k))}</span>${p(":")} `) + jsonHtml(x, inner);
  if (Array.isArray(v) && v.every((x) => x === null || typeof x !== "object") && JSON.stringify(v).length < 100)
    return p("[") + entries.map(item).join(p(",") + " ") + p("]");
  return p(open) + "\n" + entries.map((e) => inner + item(e)).join(p(",") + "\n") + "\n" + pad + p(close);
}
function documentView(kind) {
  const d = shown[kind];
  if (!d) return "";
  let body;
  try { body = jsonHtml(JSON.parse(d.document)); } catch { body = esc(d.document); }
  return `<div class="doc" id="${kind}-doc"><div class="bar"><span class="hash">${esc(short(d.id, 10))}</span>
    <span><button class="mini" data-copy="${esc(d.document)}">copy</button><button class="mini" data-hide="${kind}">close</button></span></div><pre>${body}</pre></div>`;
}

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 4000);
}

function span(s) {
  s = Math.abs(s);
  const [n, u] = s < 90 ? [s, " s"] : s < 5400 ? [s / 60, " min"] : s < 129600 ? [s / 3600, " h"] : [s / 86400, " d"];
  return Math.round(n) + u;
}
function ago(ts) {
  const s = nowSecs() - num(ts);
  return s < 0 ? "in " + span(s) : span(s) + " ago";
}

async function loadMeta() {
  try {
    const i = await api("/v1/info");
    info = i;
    $("meta").innerHTML = `<span>${esc(i.network)}</span><span>${esc(i.version)}</span>
      <span>delegate key <button class="hash" title="Copy delegate public key" data-copy="${esc(i.delegatePubkey)}">${esc(short(i.delegatePubkey, 8))}</button></span>`;
  } catch { /* the health badge says why */ }
}

async function loadHealth() {
  const h = $("health");
  try {
    const r = await fetch("/healthz"), ok = r.ok && (await r.json()).status === "SERVING";
    h.className = ok ? "ok" : "down";
    h.lastElementChild.textContent = ok ? "arkd, emulator and database reachable" : "a dependency is unreachable, check the logs";
  } catch {
    h.className = "down"; h.lastElementChild.textContent = "delegateed is unreachable";
  }
}

async function loadDelegations() {
  const rows = [];
  let cursor = 0;
  do {
    const page = await api("/v1/admin/delegate?page_size=1000" + (cursor ? "&cursor=" + cursor : ""));
    rows.push(...(page.delegations || []));
    cursor = num(page.nextCursor);
  } while (cursor && rows.length < loadLimit);
  moreRows = Boolean(cursor);
  return rows;
}

async function loadList() {
  try {
    [status, delegations, { templates = [] }, { artifacts = [] }] = await Promise.all([
      api("/v1/admin/status"), loadDelegations(), api("/v1/admin/template"), api("/v1/admin/artifact"),
    ]);
  } catch (e) { return toast("Could not load delegations: " + e.message, true); }
  templates = templates.map((t) => ({ ...t.template, ...t }));
  if (!filter) filter = delegations.some(FILTERS[0][2]) ? "attention" : "active";
  renderStatus(); renderList();
  if (!selected) renderOverview();
}

function renderStatus() {
  const poll = num(status.pollInterval), last = num(status.lastScanAt), busy = status.renewingVtxos > 0;
  const stale = !busy && last > 0 && nowSecs() - last > Math.max(3 * poll, 30);
  const active = delegations.filter((d) => d.delegation.status === "active" && d.managed);
  const total = active.reduce((a, d) => a + num(d.totalAmount), 0), vtxos = active.reduce((a, d) => a + num(d.vtxoCount), 0);
  const fees = status.intentFees, charged = fees && Object.values(fees).some(charges), next = (status.batches || [])[0];
  $("status").innerHTML = [
    busy ? `<span class="busy"><i class="pulse"></i>Renewing <b>${status.renewingVtxos}</b> VTXO${status.renewingVtxos > 1 ? "s" : ""} in a batch now, scans resume after</span>`
      : next ? `<span>Next batch <b>${num(next.at) <= nowSecs() ? "now" : ago(next.at)}</b>: <b class="n">${next.vtxoCount}</b> VTXO${next.vtxoCount > 1 ? "s" : ""} at <b class="n">${next.delegationCount}</b> address${next.delegationCount > 1 ? "es" : ""}, <b class="n">${sats(next.totalAmount)}</b></span>`
      : !last ? `<span>First scan pending</span>` : `<span>No batch planned</span>`,
    !last ? "" : `<span class="${stale ? "warn" : ""}">Scanned <b>${ago(last)}</b>, ${stale ? `expected every ${span(poll)}: check the logs` : `every ${span(poll)}`}</span>`,
    `<span>Watching <b class="n">${sats(total)}</b> in <b class="n">${vtxos}</b> VTXO${vtxos === 1 ? "" : "s"} at <b class="n">${active.length}</b> address${active.length === 1 ? "" : "es"}</span>`,
    !fees ? `<span class="warn">arkd fees unknown, arkd is unreachable</span>`
      : `<span>arkd ${charged ? `<b>charges intent fees</b>, <button class="link" id="see-fees">see them</button>` : "charges no intent fee"}</span>`,
  ].join("");
}

let kindFilter = "all";
// a delegation matches its address, #id, template id, a variable value or a bound outpoint
const matches = (d, q) => {
  const x = d.delegation;
  return !q || q.replace("#", "") === String(x.id) || [x.address, x.templateId, ...Object.values(x.variables || {}), ...(x.slots || []).map((s) => s.outpoint || "")]
    .some((v) => v && v.toLowerCase().includes(q));
};
const SORTS = {
  urgency: (a, b) => URGENCY[stateOf(a).key] - URGENCY[stateOf(b).key] || (num(a.nextExpiry) || Infinity) - (num(b.nextExpiry) || Infinity),
  amount: (a, b) => num(b.totalAmount) - num(a.totalAmount),
  newest: (a, b) => num(b.delegation.createdAt) - num(a.delegation.createdAt),
};
function visibleRows() {
  const q = $("search").value.trim().toLowerCase(), fn = FILTERS.find((f) => f[0] === filter)[2];
  return delegations.filter((d) => fn(d) && (kindFilter === "all" || kindKey(d.delegation) === kindFilter) && matches(d, q)).sort(SORTS[$("sort").value]);
}
// nextOf says what comes next for an active delegation, else what happened last
function nextOf(d, st) {
  const k = kindOf(d.delegation), at = num(d.nextBatchAt), due = num(d.nextRenewalAt);
  if (st.key !== "ok" || st.dot === "renewing" || d.delegation.status !== "active") return st.why || st.text;
  if (at) return (at <= nowSecs() ? "joins a batch now" : "joins a batch " + ago(at));
  if (due && k === KINDS.renewal) return (due <= nowSecs() ? "renewable now" : "renews " + ago(due));
  return st.text;
}

function renderList() {
  $("filters").innerHTML = FILTERS.map(([id, label, fn]) => {
    const n = delegations.filter(fn).length;
    return `<button data-filter="${id}" aria-pressed="${id === filter}" class="${id === "attention" && n ? "alert" : ""}">${label} <span class="n">${n}</span></button>`;
  }).join("");
  const inFilter = delegations.filter(FILTERS.find((f) => f[0] === filter)[2]);
  $("kinds").innerHTML = [["all", "All"], ["renewal", "Renewal"], ["boarding", "Boarding"], ["spend", "Spend"]].map(([id, label]) => {
    const n = id === "all" ? inFilter.length : inFilter.filter((d) => kindKey(d.delegation) === id).length;
    return n || id === "all" || id === kindFilter ? `<button data-kind="${id}" aria-pressed="${id === kindFilter}">${label}<span class="n">${n}</span></button>` : "";
  }).join("");
  $("kinds").classList.toggle("more", $("kinds").scrollWidth > $("kinds").clientWidth);
  const rows = visibleRows();
  $("shown").textContent = `${rows.length.toLocaleString()} shown, ${sats(rows.reduce((a, d) => a + num(d.totalAmount), 0))}`;
  if (!rows.length) {
    $("rows").innerHTML = `<li class="empty">${$("search").value.trim() ? "Nothing matches your search."
      : filter === "attention" ? "Nothing needs attention: every active delegation runs on time."
      : delegations.length ? "No delegations here."
      : "No delegations yet. Wallets register one with POST /v1/delegate on the public port."}</li>`;
    return;
  }
  const more = rows.length - MAX_ROWS;
  $("rows").innerHTML = rows.slice(0, MAX_ROWS).map((d) => {
    const st = stateOf(d), address = d.delegation.address;
    const selection = "id/" + d.delegation.id;
    const parent = num(d.delegation.parentId);
    const kind = kindKey(d.delegation), coins = num(d.vtxoCount), next = nextOf(d, st);
    // addresses of one server share their first characters: the tail tells them apart
    const label = address ? "…" + address.slice(-16) : parent ? `#${d.delegation.id} successor of #${parent}` : `#${d.delegation.id}`;
    return `<li><button data-address="${esc(selection)}" aria-current="${selection === selected}" title="${esc(address || "#" + d.delegation.id)}">
      <span class="dot ${st.dot}"></span><span class="hash">${esc(label)}</span><span class="amt">${coins ? sats(d.totalAmount) : ""}</span>
      <span></span><span class="sub ${st.key !== "ok" ? st.key : st.dot}" title="${esc(next)}"><span class="kind">${kind}</span> · ${esc(next)}</span><span class="count">${coins ? `${coins} coin${coins > 1 ? "s" : ""}` : ""}</span></button></li>`;
  }).join("") + (more > 0 ? `<li class="empty">${more.toLocaleString()} more. Search or filter to narrow down.</li>` : "")
    + (moreRows ? `<li class="empty">Only the newest ${delegations.length.toLocaleString()} delegations are loaded. <button class="link" id="load-more">Load more</button></li>` : "");
  $("rows").querySelector("[aria-current=true]")?.scrollIntoView({ block: "nearest" });
}

function renderOverview() {
  // don't wipe a half-typed form on refresh
  if ($("register")?.document.value) return;
  const held = delegations.filter((d) => d.delegation.status === "active" && d.managed && num(d.nextExpiry))
    .sort((a, b) => num(a.nextExpiry) - num(b.nextExpiry));
  const now = nowSecs(), shown = held.slice(0, MAX_LANES);
  // log axis: a linear one would hide the near end
  const far = Math.max(...shown.map((d) => num(d.nextExpiry) - now), 2 * AXIS_UNIT);
  const pct = (x) => Math.log1p(Math.max(0, x) / AXIS_UNIT) / Math.log1p(far / AXIS_UNIT) * 100;
  const batches = status?.batches || [], reserve = num(status?.renewalReserve), wait = num(status?.boardingMaxWait);
  const forcing = (at) => batches.find((b) => num(b.at) === at);
  const lanes = shown.map((d) => {
    const address = d.delegation.address;
    const left = num(d.nextExpiry) - now, win = num(d.nextExpiry) - num(d.nextRenewalAt), st = stateOf(d);
    // the reserve starts at the deadline: the window's end when it is shorter than the reserve
    const deadline = Math.max(num(d.nextDeadline) - now, left - win), at = num(d.nextBatchAt), joins = at ? Math.max(at - now, 0) : null;
    const cls = left <= 0 || st.key !== "ok" ? "late" : st.dot === "renewing" ? "renewing" : left <= win ? "in" : "";
    const text = left <= 0 ? "expired " + ago(d.nextExpiry) : st.key === "bad" ? "not renewing, " + span(left) + " left"
      : st.dot === "renewing" ? "in the batch now" : st.key === "late" ? st.text
      : joins === null ? (left <= win ? "renewable now, not planned yet" : "renewable " + ago(d.nextRenewalAt))
      : `${left <= win ? "renewable now" : "renewable " + ago(d.nextRenewalAt)}, joins the batch ${joins ? ago(at) : "now"}${deadline - joins > 60 ? `, ${span(deadline - joins)} before its deadline` : ""}`;
    const forced = at && forcing(Math.max(at, Math.floor(now)))?.forcedByOutpoint;
    return `<button data-address="${esc("id/" + d.delegation.id)}" class="hash" title="${esc(address)}">${esc(address ? "…" + address.slice(-14) : "#" + d.delegation.id)}</button>
      <div class="lane ${left <= 0 ? "late" : ""}" role="img" aria-label="${esc(text)}, expires ${ago(d.nextExpiry)}" title="${forced ? esc("batch forced by " + short(forced, 8)) : ""}">
        <div class="left" style="width:${pct(left - win)}%"></div><div class="window" style="width:${pct(deadline) - pct(left - win)}%"></div><div class="reserve" style="width:${pct(left) - pct(deadline)}%"></div>
        ${joins === null || st.dot === "renewing" ? "" : `<i class="batch" style="left:${pct(joins)}%"></i>`}</div>
      <span class="t n ${cls}">${text}</span>`;
  }).join("");
  const ticks = [3600, 6 * 3600, 86400, 3 * 86400, 7 * 86400, 14 * 86400, 30 * 86400, 90 * 86400].filter((t) => t < far * 0.85);
  const axis = `<span></span><div class="axis"><i style="left:0">now</i>${ticks.map((t) => `<i style="left:${pct(t)}%">${span(t)}</i>`).join("")}</div><span></span>`;
  const byId = Object.fromEntries(delegations.map((d) => [num(d.delegation.id), d]));
  const planRows = batches.map((b) => {
    const at = num(b.at), d = byId[num(b.forcedByDelegationId)], expiry = d ? num(d.nextExpiry) : 0;
    const why = expiry > at ? `, ${span(expiry - at)} before it expires` : expiry ? "" : ", a deposit";
    return `<tr><td class="n">${at <= now ? "now" : ago(b.at)}</td>
      <td class="n">${b.vtxoCount} VTXO${b.vtxoCount > 1 ? "s" : ""} at ${b.delegationCount} address${b.delegationCount > 1 ? "es" : ""}, ${sats(b.totalAmount)}</td>
      <td>forced by <button class="link hash" data-address="${esc("id/" + b.forcedByDelegationId)}" title="${esc(b.forcedByOutpoint)}">${esc(short(b.forcedByOutpoint, 8))}</button>${why}</td></tr>`;
  }).join("");

  const f = status?.intentFees, rows = f && [["each VTXO renewed", f.offchainInput], ["each output created", f.offchainOutput]].filter((r) => charges(r[1]));
  const strangers = delegations.filter((d) => d.unmanagedReason === "registered under another key").length;
  $("detail").removeAttribute("aria-busy");
  $("detail").innerHTML = `
    <h2>Overview</h2>
    ${strangers ? `<p class="note"><b>${strangers}</b> active delegation${strangers > 1 ? "s were" : " was"} registered under another delegate key and cannot be renewed by this instance. If the key was rotated by mistake, restore the previous key in the configured keyring.</p>` : ""}
    <h3>Planned batches</h3>
    <p>A batch is submitted at the latest <b>${span(reserve)}</b> before its first VTXO expires, or as soon as a VTXO is renewable when its window is shorter, so that every VTXO renewable by then renews with it. Deposits wait at most <b>${span(wait)}</b> for a batch.</p>
    ${planRows ? `<div class="scroll"><table class="plan"><thead><tr><th>When</th><th>Carries</th><th>Why then</th></tr></thead><tbody>${planRows}</tbody></table></div>`
      : `<p class="empty">No batch planned: nothing renewable is in sight.</p>`}
    <h3>Next to expire</h3>
    <p>Each bar runs from now to the address's earliest expiry. The hatched part is when it can be renewed, the red end is the reserve the daemon never submits in, and the dot is the batch it joins.</p>
    ${shown.length ? `<div class="horizon">${lanes}${axis}</div><p class="legend"><span><i></i>waiting</span><span><i class="w"></i>renewable</span><span><i class="r"></i>reserve</span><span><i class="b"></i>planned batch</span></p>${held.length > shown.length ? `<p class="state">and ${held.length - shown.length} more, later</p>` : ""}`
      : `<p class="empty">No VTXO is being watched yet. They show up here after the next scan once coins sit at a registered address.</p>`}
    <h3>What arkd charges</h3>
    ${!f ? `<p>Unknown: arkd is unreachable.</p>`
      : !rows.length ? `<p>Nothing.</p>`
      : `<p>A renewal pays every line below. A delegation whose template caps its fee lower is skipped and shows up under Needs attention until the fee drops.</p>
        <div class="scroll"><table><thead><tr><th>For</th><th>Fee program, in sats</th></tr></thead><tbody>
        ${rows.map(([k, v]) => `<tr><td>${k}</td><td class="hash">${esc(v)}</td></tr>`).join("")}</tbody></table></div>`}
    <h3>Templates</h3>
    <p>What a delegation may be registered with. A disabled template registers nothing and renews nothing. A template whose intents keep being rejected is disabled by the daemon, unless it is trusted.</p>
    ${templates.length ? `<div class="scroll"><table><thead><tr><th>Template</th><th>Variables</th><th>Status</th><th>Trusted</th><th>Delegations</th><th>Failed cycles</th><th></th></tr></thead><tbody>
      ${templates.map((t) => `<tr><td class="hash"><button class="link hash" data-template="${esc(t.id)}" title="Show the document">${esc(short(t.id, 10))}</button></td>
        <td class="hash">${(t.params || []).map((p) => `${esc(p.name)}: ${esc(p.type)}`).join("<br>")}</td>
        <td class="res ${t.status === "active" ? "ok" : "bad"}">${esc(t.status)}</td>
        <td>${t.trusted ? "yes" : "no"} <button class="link" data-template-trusted="${t.trusted ? "false" : "true"}" data-id="${esc(t.id)}">${t.trusted ? "Distrust" : "Trust"}</button></td>
        <td class="n">${num(t.delegations)}</td><td class="n">${num(t.failures)}</td>
        <td><button class="link" data-template-status="${t.status === "active" ? "disabled" : "active"}" data-id="${esc(t.id)}">${t.status === "active" ? "Disable" : "Enable"}</button>
        ${num(t.delegations) ? "" : `<button class="link danger" data-template-delete="${esc(t.id)}">Delete</button>`}</td></tr>`).join("")}
      </tbody></table></div>${documentView("template")}`
      : `<p class="empty">No template registered. Developers register one with POST /v1/template on the public port.</p>`}
    <h3>Artifacts</h3>
    <p>Compiler artifacts templates may reference by id. An artifact still referenced by a template cannot be deleted.</p>
    ${artifacts.length ? `<div class="scroll"><table><thead><tr><th>Artifact</th><th>Registered</th><th></th></tr></thead><tbody>
      ${artifacts.map((a) => `<tr><td class="hash"><button class="link hash" data-artifact="${esc(a.id)}" title="Show the document">${esc(short(a.id, 10))}</button></td>
        <td>${ago(a.createdAt)}</td><td><button class="link danger" data-artifact-delete="${esc(a.id)}">Delete</button></td></tr>`).join("")}
      </tbody></table></div>${documentView("artifact")}`
      : `<p class="empty">No artifact registered.</p>`}
    <h3>Register</h3>
    <p>Paste a document and register it. The same public endpoints developers use, served on this port.</p>
    <form id="register"><textarea name="document" placeholder='{"format": "..."}' aria-label="Document"></textarea>
      <div class="actions"><button class="primary" value="template">Register template</button><button value="artifact">Register artifact</button></div></form>`;
}

async function loadDetail() {
  if (!selected) { detail = null; $("detail").removeAttribute("aria-busy"); return status && renderOverview(); }
  const address = selected;
  if ("id/" + detail?.delegation.id !== address) {
    allVtxos = false;
    $("detail").setAttribute("aria-busy", "true");
    $("detail").innerHTML = `<h2 class="hash" style="font-size:.95rem;color:var(--muted)">${esc(short(address, 12))}</h2>${skeleton(5)}`;
  }
  try {
    detail = await api(address.startsWith("id/") ? "/v1/admin/delegation/" + encodeURIComponent(address.slice(3)) : "/v1/delegate/" + encodeURIComponent(address));
  } catch (e) {
    $("detail").removeAttribute("aria-busy");
    $("detail").innerHTML = `<p class="empty">Could not load ${esc(short(address, 12))}: ${esc(e.message)}. <button class="link" id="home2">Back to the overview</button></p>`;
    return;
  }
  if (address !== selected) return; // the operator moved on while this was loading
  $("detail").removeAttribute("aria-busy");
  renderDetail();
}

// batchAt is the planned batch time, 0 without one; renewing when a session holds the delegation
function lifeBar(v, batchAt, renewing, company) {
  const now = nowSecs(), at = num(batchAt);
  const joins = renewing ? "in the batch now" : !at ? "" : at <= now ? `overdue by ${span(now - at)}` : `joins the batch ${ago(at)}${company}`;
  if (!num(v.expiresAt)) return `<div class="state ${renewing ? "renewing" : at && at <= now ? "late" : ""}">onchain, ${joins || `boarded at the next batch${num(v.renewableAt) ? " from " + ago(v.renewableAt) : ""}`}</div>`;
  const born = num(v.createdAt), dies = num(v.expiresAt), windowSecs = dies - num(v.renewableAt), reserve = num(status?.renewalReserve);
  const life = Math.max(dies - born, 1), pct = (x) => Math.min(100, Math.max(0, (x / life) * 100)), left = dies - now;
  const deadline = Math.max(num(v.renewableAt), dies - reserve);
  const [cls, text] = left <= 0 ? ["late", `expired ${ago(dies)}`]
    : renewing ? ["renewing", joins]
    : at && at <= now ? ["late", joins]
    : num(v.renewableAt) >= dies ? ["late", "cannot be renewed before it expires"]
    : left <= windowSecs ? ["in", `renewable since ${span(now - num(v.renewableAt))}, ${joins || "not planned yet: waiting for a locktime or confirmations"}`]
    : ["", `renewable ${ago(v.renewableAt)}, ${joins || "not planned yet"}`];
  return `<div class="life" role="img" aria-label="${esc(text)}, expires ${ago(dies)}">
      <div class="elapsed" style="width:${pct(now - born)}%"></div>
      <div class="window" style="width:${pct(windowSecs)}%"></div>
      <div class="reserve" style="width:${pct(dies - deadline)}%"></div>
      <div class="now" style="left:${pct(now - born)}%"></div>
      ${at && !renewing ? `<i class="batch" style="left:${pct(Math.max(at, now) - born)}%"></i>` : ""}
    </div><div class="state ${cls}">${text}, expires ${ago(dies)}${v.preconfirmed ? ", not in a batch yet" : ""}</div>`;
}

function renderDetail() {
  const d = detail.delegation, renewals = detail.renewals || [];
  const vtxos = (detail.vtxos || []).slice().sort((a, b) => num(a.renewableAt) - num(b.renewableAt));
  const held = vtxos.reduce((a, v) => a + num(v.amount), 0), shownVtxos = allVtxos ? vtxos : vtxos.slice(0, MAX_VTXOS);
  const active = d.status === "active";
  const inList = delegations.find((x) => x.delegation.id === d.id), st = inList && stateOf(inList);
  const slots = d.slots || [], kind = kindOf(d), spend = kind === KINDS.spend, done = kind.done;
  const types = Object.fromEntries((templates.find((t) => t.id === d.templateId)?.params || []).map((p) => [p.name, p.type]));
  const batchAt = detail.batchAt || {}, renewing = Boolean(inList?.renewing), reserve = num(status?.renewalReserve);
  // who else is in a vtxo's batch: the others here, and the batch's count when it is among the ones listed
  const company = (v) => {
    const at = num(batchAt[v.outpoint]), here = vtxos.filter((x) => num(batchAt[x.outpoint]) === at).length - 1;
    const b = (status?.batches || []).find((x) => num(x.at) === Math.max(at, Math.floor(nowSecs())));
    const elsewhere = b ? num(b.vtxoCount) - here - 1 : 0;
    return !at || (!here && !elsewhere) ? "" : ` with ${here ? `${here} other${here > 1 ? "s" : ""} here` : ""}${here && elsewhere ? " and " : ""}${elsewhere ? `${elsewhere} elsewhere` : ""}`;
  };
  $("detail").innerHTML = `
    <div class="title">
      <div><h2>Delegation ${esc(d.id)} <span class="badge ${!active ? "off" : st?.key === "bad" ? "bad" : st?.key === "late" ? "late" : st?.dot === "renewing" ? "renewing" : "ok"}">${!active ? (d.status === "cancelled" ? "stopped by an operator" : d.status === "done" ? done : esc(d.status)) : st?.skipped ? esc(st.text) : st?.key === "bad" ? (spend ? "failing" : "not renewing") : st?.key === "late" ? "overdue" : st?.dot === "renewing" ? "in a batch now" : kind.doing}</span></h2>
        ${d.address ? `<div class="hash">${esc(d.address)}</div>` : ""}</div>
      <div class="actions">${d.address ? `<button data-copy="${esc(d.address)}">Copy address</button>` : ""}
        ${explorer() && /^t?ark1/.test(d.address) ? `<button data-open="${esc(explorer() + "/address/" + d.address)}">View in explorer</button>` : ""}
        ${active ? `<button class="danger" id="stop">${kind.stop}</button>` : d.status === "cancelled" ? `<button class="primary" id="resume">${kind.resume}</button>` : ""}</div>
    </div>
    <dl class="facts"><div><dt>Template</dt><dd class="hash" title="${esc(d.templateId)}">${esc(short(d.templateId, 8))}<button class="mini" data-copy="${esc(d.templateId)}" title="Copy the template id">copy</button></dd></div>
      ${num(d.parentId) ? `<div><dt>Successor of</dt><dd><a href="#id/${num(d.parentId)}">#${num(d.parentId)}</a></dd></div>` : ""}
      ${Object.entries(d.variables || {}).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${variable(k, types[k], v)}</dd></div>`).join("")}
      <div><dt>Registered</dt><dd>${ago(d.createdAt)}</dd></div>
      <div><dt>Expires</dt><dd>${num(d.expiresAt) ? `<span title="${new Date(num(d.expiresAt) * 1000).toLocaleString()}">${ago(d.expiresAt)}</span>` : "never"}</dd></div></dl>
    ${st?.why && active ? `<p class="note">${esc(st.why)}</p>` : ""}
    <h3>${kind.coins}</h3>
    ${vtxos.length > 1 ? `<p><b class="n">${vtxos.length}</b> VTXOs holding <b class="n">${sats(held)}</b>${spend ? "" : ", soonest to renew first"}.</p>` : ""}
    ${vtxos.length && kind === KINDS.renewal ? `<p class="state">A renewable VTXO waits for the batch of the first one to reach its deadline, ${span(reserve)} before expiry, so that they renew together. The dot is that batch.</p>` : ""}
    ${vtxos.length ? shownVtxos.map((v) => `<div class="vtxo"><div class="top"><span class="hash">${explore(v.outpoint)}</span>
        <span class="amount n">${sats(v.amount)}${(v.assets || []).map((a) => ` + ${num(a.amount).toLocaleString()} of ${esc(short(a.assetId, 6))}`).join("")}</span></div>
        ${spend ? `<div class="state">${num(v.expiresAt) ? "expires " + ago(v.expiresAt) : "onchain"}</div>` : lifeBar(v, batchAt[v.outpoint], renewing, company(v))}</div>`).join("") + (vtxos.length > shownVtxos.length ? `<p class="state"><button class="link" id="all-vtxos">Show all ${vtxos.length}</button>, the ${shownVtxos.length} soonest are above.</p>` : "")
      : `<p class="empty">${kind.noCoin}</p>`}
    <h3>${kind.attempts}</h3>
    ${renewals.length ? `<div class="scroll"><table><thead><tr><th>When</th><th>Result</th><th>VTXOs</th><th>Batch or reason</th></tr></thead><tbody>
      ${renewals.map((r) => `<tr><td title="${new Date(num(r.attemptedAt) * 1000).toLocaleString()}">${ago(r.attemptedAt)}</td>
        <td class="res ${r.success ? "ok" : "bad"}">${r.success ? done : "failed"}</td>
        <td class="hash">${(r.outpoints || []).map((o) => explore(o, short(o, 8))).join("<br>")}</td>
        <td class="${r.success ? "hash" : ""}">${!r.success ? esc(r.error) : explorer() ? explore(r.commitmentTxid, short(r.commitmentTxid, 12)) : `<button class="link hash" data-copy="${esc(r.commitmentTxid)}" title="Copy the txid">${esc(short(r.commitmentTxid, 12))}</button>`}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="state">A failure that repeats is listed once, at the time it first happened.</p>`
      : `<p class="empty">${kind.noAttempt}</p>`}
    <h3>Inputs</h3>
    <p>Each input of the template: what it watches or the output bound to it, and who can spend it, one tapscript each.</p>
    ${slots.map((sl) => `<h4>${esc(sl.name)} <span class="badge">${sl.onchain ? "onchain" : "offchain"}</span></h4>
      ${sl.outpoint ? `<p class="hash">${explore(sl.outpoint)} <button class="mini" data-copy="${esc(sl.outpoint)}" title="Copy the outpoint">copy</button></p>` : ""}
      <ul class="paths">${(sl.tapscripts || []).map((t) => `<li><span class="words">${esc(scriptWords(t))}</span><button class="mini" data-copy="${esc(t)}" title="Copy the script hex">hex</button></li>`).join("")}</ul>`).join("")}`;
}

async function setRenewing(on) {
  const d = detail.delegation;
  $("detail").querySelector("#stop, #resume")?.setAttribute("aria-busy", "true");
  try {
    if (on) await send("POST", "/v1/admin/delegation/" + encodeURIComponent(d.id) + "/resume", {});
    else await api("/v1/admin/delegation/" + encodeURIComponent(d.id), { method: "DELETE" });
    toast(on ? "Resumed" : spends(d) ? "Spend cancelled" : "Renewing stopped");
  } catch (e) { toast(`Could not ${on ? "resume" : "stop"} it: ${e.message}`, true); }
  refresh();
}

function askStop() {
  const held = delegations.find((x) => x.delegation.id === detail.delegation.id), spend = spends(detail.delegation);
  $("confirm-title").textContent = spend ? "Cancel this spend?" : "Stop renewing this address?";
  $("confirm").querySelector("[value=no]").textContent = spend ? "Keep the spend" : "Keep renewing";
  $("confirm-yes").textContent = kindOf(detail.delegation).stop;
  $("confirm-text").textContent = spend ? "The daemon stops trying it: its coins stay with their owner, who can sign a new spend. Nothing is deleted." : (num(held?.vtxoCount)
    ? `${sats(held.totalAmount)} in ${held.vtxoCount} VTXO${held.vtxoCount > 1 ? "s" : ""}, the first expiring ${ago(held.nextExpiry)}, will expire`
    : "Coins sent to it later will expire") + " unless the owner exits or you resume. The owner cannot register it again until you resume. Nothing is deleted.";
  $("confirm").showModal();
}

const go = (address) => { location.hash = address || ""; if (!address) history.replaceState(null, "", location.pathname); };

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.filter) { filter = b.dataset.filter; renderList(); }
  else if (b.dataset.kind) { kindFilter = b.dataset.kind; renderList(); }
  else if (b.dataset.address) go(b.dataset.address);
  else if (b.dataset.open) window.open(b.dataset.open, "_blank", "noopener");
  else if (b.dataset.copy) navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Copied"), () => toast("Copy failed, select the text instead", true));
  else if (b.id === "home" || b.id === "home2" || b.id === "see-fees") go("");
  else if (b.id === "all-vtxos") { allVtxos = true; renderDetail(); }
  else if (b.id === "stop") askStop();
  else if (b.id === "confirm-yes") { $("confirm").close(); setRenewing(false); }
  else if (b.value === "no") $("confirm").close();
  else if (b.id === "resume") setRenewing(true);
  else if (b.id === "load-more") { loadLimit += 5000; refresh(); }
  else if (b.dataset.hide) { delete shown[b.dataset.hide]; renderOverview(); }
  else if (b.dataset.template) showDocument("template", b.dataset.template);
  else if (b.dataset.artifact) showDocument("artifact", b.dataset.artifact);
  else if (b.dataset.templateStatus) act(send("PUT", "/v1/admin/template/" + encodeURIComponent(b.dataset.id) + "/status", { status: b.dataset.templateStatus }),
    "Template " + b.dataset.templateStatus, "Could not change the template: ");
  else if (b.dataset.templateTrusted) act(send("PUT", "/v1/admin/template/" + encodeURIComponent(b.dataset.id) + "/trusted", { trusted: b.dataset.templateTrusted === "true" }),
    b.dataset.templateTrusted === "true" ? "Template trusted" : "Template no longer trusted", "Could not change the template: ");
  else if (b.dataset.templateDelete) act(api("/v1/admin/template/" + encodeURIComponent(b.dataset.templateDelete), { method: "DELETE" }), "Template deleted", "Could not delete the template: ");
  else if (b.dataset.artifactDelete) act(api("/v1/admin/artifact/" + encodeURIComponent(b.dataset.artifactDelete), { method: "DELETE" }), "Artifact deleted", "Could not delete the artifact: ");
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "register") return;
  e.preventDefault();
  const kind = e.submitter?.value === "artifact" ? "artifact" : "template", document_ = e.target.document.value.trim();
  if (!document_) return toast("Paste a document first", true);
  e.target.setAttribute("aria-busy", "true");
  send("POST", "/v1/" + kind, { document: document_ })
    .then((r) => { const id = (kind === "artifact" ? r.artifact : r.template).id; toast(`Registered ${kind} ${short(id, 8)}`); e.target.reset(); refresh(); }, (err) => toast(`Could not register the ${kind}: ${err.message}`, true))
    .finally(() => e.target.removeAttribute("aria-busy"));
});
document.addEventListener("keydown", (e) => {
  if ($("confirm").open || e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = e.target.matches("input, textarea");
  if (e.key === "/" && !typing) { e.preventDefault(); $("search").focus(); }
  else if (e.key === "Escape") { typing ? e.target.blur() : go(""); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !typing) {
    const rows = visibleRows().slice(0, MAX_ROWS); if (!rows.length) return;
    e.preventDefault();
    const i = rows.findIndex((d) => "id/" + d.delegation.id === selected), step = e.key === "ArrowDown" ? 1 : -1;
    go("id/" + rows[Math.min(rows.length - 1, Math.max(0, i < 0 ? 0 : i + step))].delegation.id);
  }
});
$("search").addEventListener("input", renderList);
$("sort").addEventListener("change", renderList);
addEventListener("hashchange", () => { selected = location.hash.slice(1); renderList(); loadDetail(); });

function refresh() { loadHealth(); loadList().then(loadDetail); }
loadMeta(); refresh();
setInterval(() => { if (!document.hidden && !$("confirm").open) refresh(); }, 15000);
</script>
</body>
</html>
