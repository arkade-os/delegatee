name: quality

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Run linter
        uses: golangci/golangci-lint-action@v7

  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint protos and check generated stubs are current
        run: |
          make proto
          git diff --exit-code
