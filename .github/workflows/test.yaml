name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Run unit tests
        run: make test

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Run Nigiri
        uses: vulpemventures/nigiri-github-action@v1

      - name: Run regtest environment
        run: make regtest-up

      - name: Run integration tests
        run: make test-e2e

      - name: Capture logs
        if: failure()
        run: |
          for c in emulator arkd arkd-wallet delegatee-pg; do
            echo "=== $c ==="
            docker logs --tail 300 "$c" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: make regtest-down
