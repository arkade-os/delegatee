syntax = "proto3";

package executor.v1;

import "meshapi/gateway/annotations.proto";

service ExecutorService {
  // GetInfo tells the daemon's version, network and keys.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/info"
    };
  }
  // RegisterDelegation binds a one-input template to variables: the daemon acts on every coin landing at
  // the derived address until expires_at. Registering an active delegation again returns it unchanged.
  rpc RegisterDelegation(RegisterDelegationRequest) returns (RegisterDelegationResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/delegation"
      body: "*"
    };
  }
  // GetDelegation returns a delegation with its coins, by ?id= or by ?address=.
  rpc GetDelegation(GetDelegationRequest) returns (GetDelegationResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/delegation"
    };
  }
  // RegisterArtifact stores a compiler artifact under its content id. Idempotent.
  rpc RegisterArtifact(RegisterArtifactRequest) returns (RegisterArtifactResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/artifact"
      body: "*"
    };
  }
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/artifact/{id}"
    };
  }
  // RegisterTemplate stores a template under its content id once its artifacts are registered. Idempotent.
  rpc RegisterTemplate(RegisterTemplateRequest) returns (RegisterTemplateResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/template"
      body: "*"
    };
  }
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/template/{id}"
    };
  }
  // ListTemplates lists templates without their documents, newest first.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/templates"
    };
  }
}

message GetInfoRequest {}
message GetInfoResponse {
  string version = 1;
  string network = 2;
  // cosigner_pubkey is the compressed key that cosigns arkd's vtxo trees.
  string cosigner_pubkey = 3;
  string server_pubkey = 4;
  // encryption_pubkey seals template secrets for this daemon; empty without an encryption key.
  string encryption_pubkey = 5;
  // emulator_pubkey merges into server_pubkey once arkd's signer runs the arkade covenants.
  string emulator_pubkey = 6;
}

message RegisterDelegationRequest {
  string template_id = 1;
  // variables are the template's declared variables, values in lower-case hex.
  map<string, string> variables = 2;
  // expires_at is unix seconds; 0 never expires.
  int64 expires_at = 3;
}
message RegisterDelegationResponse {
  Delegation delegation = 1;
}
message GetDelegationRequest {
  int64 id = 1;
  string address = 2;
}
message GetDelegationResponse {
  Delegation delegation = 1;
  // coins are the vtxos found at the delegation's inputs, present and spent.
  repeated Coin coins = 2;
}

message RegisterArtifactRequest {
  // document is the artifact JSON document.
  string document = 1;
}
message RegisterArtifactResponse {
  Artifact artifact = 1;
}
message GetArtifactRequest {
  string id = 1;
}
message GetArtifactResponse {
  Artifact artifact = 1;
}

message RegisterTemplateRequest {
  // document is the template JSON document.
  string document = 1;
}
message RegisterTemplateResponse {
  Template template = 1;
}
message GetTemplateRequest {
  string id = 1;
}
message GetTemplateResponse {
  Template template = 1;
}
message ListTemplatesRequest {
  // status filters on active or disabled; empty lists all.
  string status = 1;
}
message ListTemplatesResponse {
  repeated Template templates = 1;
}

message Artifact {
  string id = 1;
  string document = 2;
  // created_at is unix seconds.
  int64 created_at = 3;
}
message Template {
  string id = 1;
  string document = 2;
  repeated string artifact_ids = 3;
  repeated Param params = 4;
  // type is proof or virtual.
  string type = 5;
  // status is active or disabled.
  string status = 6;
  // created_at is unix seconds.
  int64 created_at = 8;
}
message Param {
  string name = 1;
  string type = 2;
}
message Delegation {
  int64 id = 1;
  string fingerprint = 2;
  string address = 3;
  string template_id = 4;
  map<string, string> variables = 5;
  repeated Input inputs = 6;
  // stream_id is the stream that spawned the delegation, 0 when a client registered it.
  int64 stream_id = 7;
  // expires_at is unix seconds, 0 when the delegation never expires.
  int64 expires_at = 8;
  // status is active, cancelled, expired or done.
  string status = 9;
  // created_at and updated_at are unix seconds.
  int64 created_at = 10;
  int64 updated_at = 11;
}
// Input is one template input of a delegation.
message Input {
  string name = 1;
  bool onchain = 2;
  // script is the hex output script of the input's contract.
  string script = 3;
  repeated string tapscripts = 4;
  // locktime is the absolute locktime of the input's spend leaf, 0 without one.
  uint32 locktime = 5;
}
// Coin is a vtxo found at a delegation's input.
message Coin {
  // outpoint is txid:vout.
  string outpoint = 1;
  // input is the index of the delegation input the coin landed at.
  int32 input = 2;
  uint64 amount = 3;
  // expires_at is unix seconds, 0 when the coin never expires.
  int64 expires_at = 4;
  // due is unix seconds, when the delegation becomes eligible to spend the coin.
  int64 due = 5;
  // status is present or spent.
  string status = 6;
  // spent_by is the txid that consumed the coin, empty while present or unknown.
  string spent_by = 7;
  // confirmations is how deep an onchain coin is buried, 0 in the mempool and for vtxos.
  int32 confirmations = 8;
}
