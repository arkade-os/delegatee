syntax = "proto3";

package delegatee.v1;

import "delegatee/v1/service.proto";
import "meshapi/gateway/annotations.proto";

// AdminService is served on the admin port only, next to DelegateeService.
service AdminService {
  // UpdateTemplate sets a template's status; activating resets its failures.
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/admin/template/{id}"
      body: "*"
    };
  }
  // DeleteTemplate fails with FailedPrecondition while a delegation references the template.
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse) {
    option (meshapi.gateway.http) = {
      delete: "/v1/admin/template/{id}"
    };
  }
  // ListArtifacts lists artifacts without their documents, newest first.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/admin/artifacts"
    };
  }
  // DeleteArtifact fails with FailedPrecondition while a template references the artifact.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse) {
    option (meshapi.gateway.http) = {
      delete: "/v1/admin/artifact/{id}"
    };
  }
  // ListDelegations lists delegations by the earliest due of their coins, those without coins last, paged by cursor.
  rpc ListDelegations(ListDelegationsRequest) returns (ListDelegationsResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/admin/delegations"
    };
  }
  // CancelDelegation stops an active delegation; its fingerprint cannot be registered again until resumed.
  rpc CancelDelegation(CancelDelegationRequest) returns (CancelDelegationResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/admin/delegation/{id}/cancel"
      body: "*"
    };
  }
  // ResumeDelegation puts a cancelled delegation back to active.
  rpc ResumeDelegation(ResumeDelegationRequest) returns (ResumeDelegationResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/admin/delegation/{id}/resume"
      body: "*"
    };
  }
  // ListAttempts lists the attempts of a delegation newest first, paged by cursor.
  rpc ListAttempts(ListAttemptsRequest) returns (ListAttemptsResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/admin/delegation/{id}/attempts"
    };
  }
  // RegisterStream has the daemon run a template's trigger against arkd's transactions, spawning a delegation for each match.
  rpc RegisterStream(RegisterStreamRequest) returns (RegisterStreamResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/admin/stream"
      body: "*"
    };
  }
  // ListStreams lists the streams of every status, oldest first.
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/admin/streams"
    };
  }
  // CancelStream stops a stream; registering it again fails while it stays cancelled.
  rpc CancelStream(CancelStreamRequest) returns (CancelStreamResponse) {
    option (meshapi.gateway.http) = {
      post: "/v1/admin/stream/{id}/cancel"
      body: "*"
    };
  }
  // GetHealth names each dependency with the error it answers, if any.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/admin/health"
    };
  }
  // GetStatus reports what the loop holds: the queue, what is registered at arkd and the forecast batches.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (meshapi.gateway.http) = {
      get: "/v1/admin/status"
    };
  }
}

message UpdateTemplateRequest {
  string id = 1;
  // status is active or disabled.
  string status = 2;
}
message UpdateTemplateResponse {}
message DeleteTemplateRequest {
  string id = 1;
}
message DeleteTemplateResponse {}
message ListArtifactsRequest {}
message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
}
message DeleteArtifactRequest {
  string id = 1;
}
message DeleteArtifactResponse {}
message ListDelegationsRequest {
  // status filters on active, cancelled, expired or done; empty lists all.
  string status = 1;
  // cursor is the next_cursor of the previous page; empty starts from the top.
  string cursor = 2;
  // limit is the page size: 100 when 0, at most 1000.
  int32 limit = 3;
  // stream_id lists only the delegations the stream spawned; 0 lists all.
  int64 stream_id = 4;
  // template_id lists only the delegations of the template; empty lists all.
  string template_id = 5;
}
message ListDelegationsResponse {
  repeated DelegationSummary delegations = 1;
  // next_cursor starts the next page; empty on the last one.
  string next_cursor = 2;
}
// DelegationSummary is a delegation with what its present coins and its attempts come to.
message DelegationSummary {
  Delegation delegation = 1;
  int64 coins = 2;
  uint64 amount = 3;
  // next_due is unix seconds, the earliest due of the present coins, 0 without any.
  int64 next_due = 4;
  // last_attempt is the status of the newest attempt, empty without one.
  string last_attempt = 5;
}
message CancelDelegationRequest {
  int64 id = 1;
}
message CancelDelegationResponse {}
message ResumeDelegationRequest {
  int64 id = 1;
}
message ResumeDelegationResponse {}
message ListAttemptsRequest {
  int64 id = 1;
  // cursor is the next_cursor of the previous page; 0 starts from the newest.
  int64 cursor = 2;
  // limit is the page size: 100 when 0, at most 1000.
  int32 limit = 3;
}
message ListAttemptsResponse {
  repeated Attempt attempts = 1;
  // next_cursor starts the next page; 0 on the last one.
  int64 next_cursor = 2;
}
// Attempt is one run of a delegation over coins.
message Attempt {
  int64 id = 1;
  int64 delegation_id = 2;
  // kind is the delegation's template type: offchain or intent.
  string kind = 3;
  // coins are the outpoints the attempt spends.
  repeated string coins = 4;
  // txid is the transaction once known: the ark txid of an offchain attempt, the commitment txid of a batched one.
  string txid = 5;
  // status is submitted, succeeded or failed.
  string status = 6;
  // error says why a failed attempt failed.
  string error = 7;
  // created_at and updated_at are unix seconds.
  int64 created_at = 8;
  int64 updated_at = 9;
}
message RegisterStreamRequest {
  string template_id = 1;
  // variables are the lower-case hex values the trigger does not bind.
  map<string, string> variables = 2;
}
message RegisterStreamResponse {
  Stream stream = 1;
}
message ListStreamsRequest {}
message ListStreamsResponse {
  repeated Stream streams = 1;
}
message CancelStreamRequest {
  int64 id = 1;
}
message CancelStreamResponse {}
// Stream is an operator's standing rule: a template's trigger run against arkd's transactions.
message Stream {
  int64 id = 1;
  string template_id = 2;
  map<string, string> variables = 3;
  // status is active or cancelled.
  string status = 4;
  // created_at is unix seconds.
  int64 created_at = 5;
  // spawned is how many delegations the stream spawned, active how many of them are still active.
  int64 spawned = 6;
  int64 active = 7;
  // last_spawned_at is unix seconds, 0 before the first one.
  int64 last_spawned_at = 8;
}
message GetHealthRequest {}
message GetHealthResponse {
  // healthy is whether every entry is.
  bool healthy = 1;
  repeated HealthEntry entries = 2;
}
// HealthEntry is what one dependency answers: db, arkd, electrum, emulator or loop.
message HealthEntry {
  string name = 1;
  bool healthy = 2;
  // error says why the dependency is not healthy.
  string error = 3;
}
message GetStatusRequest {
  // horizon_seconds is how far ahead the batches are forecast, 0 for 24 hours, at most 7 days.
  int64 horizon_seconds = 1;
}
message GetStatusResponse {
  // active is how many delegations are being served.
  int64 active = 1;
  // queued is how many entries wait to be registered at arkd.
  int64 queued = 2;
  // registered is how many entries are registered at arkd, waiting for a batch.
  int64 registered = 3;
  // late is how many coins are forecast to miss their deadline.
  int64 late = 4;
  // next_due is unix seconds, when the next coin becomes ready, 0 when none will.
  int64 next_due = 5;
  // batches forecasts what the coming batches carry, the nearest first.
  repeated BatchForecast batches = 6;
  // tip_height is the chain's latest block, 0 before the first one is seen.
  int64 tip_height = 7;
  // coins is how many present coins the daemon watches.
  int64 coins = 8;
  // amount is the sum of those coins, in sats.
  uint64 amount = 9;
  // succeeded and failed count the attempts ended since the daemon started.
  uint64 succeeded = 10;
  uint64 failed = 11;
  // template_failures counts the failed attempts charged to their template since the daemon started.
  uint64 template_failures = 12;
  // reserve_seconds is how long before expiry a coin enters a batch at the latest.
  int64 reserve_seconds = 13;
  // session_seconds is how often arkd runs a batch, max_intents how many of ours one batch takes.
  int64 session_seconds = 14;
  int64 max_intents = 15;
}
// BatchForecast is what a coming batch is expected to carry of ours.
message BatchForecast {
  // at is unix seconds.
  int64 at = 1;
  int64 intents = 2;
  int64 coins = 3;
  uint64 amount = 4;
  // entries are the delegations in the batch, the first 100 at most.
  repeated ForecastEntry entries = 5;
}
// ForecastEntry is a delegation's coins in a forecast batch.
message ForecastEntry {
  int64 delegation_id = 1;
  int64 coins = 2;
  uint64 amount = 3;
  // due and deadline are unix seconds.
  int64 due = 4;
  int64 deadline = 5;
}
